<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activation cancelled</title>
<style>
  :root{ --primary:#1F4D36; --bg:#F8F5F0; --charcoal:#1B1B1B; --muted:#6B6A63; }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--charcoal);background:var(--primary);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:var(--bg);border-radius:16px;max-width:440px;width:100%;
    padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;
  }
  h1{font-size:21px;color:var(--primary);margin:0 0 14px;}
  p{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 12px;}
  p:last-child{margin-bottom:0;}
</style>
</head>
<body>
<div class="card">
  <h1>Activation cancelled</h1>
  <p>Nothing was charged.</p>
  <p>Ask your account admin to restart activation whenever you're ready.</p>
</div>
</body>
</html>
