# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two services, both running the api/ codebase:
#
#   - 50.-Platform (web): the existing, already-live Express app
#     (api/src/server.js) — every /api/... route plus the two Stripe
#     redirect pages under /billing. `name:` below matches this service's
#     real name in the Render dashboard exactly, confirmed directly
#     rather than assumed, so a Blueprint sync adopts it instead of
#     creating a duplicate.
#   - reward-issuance-worker (cron): Stage 4's reward-issuance worker
#     (api/src/workers/runRewardIssuance.js), run on a schedule instead of
#     on request. See api/README.md's "How the reward-issuance worker
#     actually works" for what it does, and the operational safety rails
#     built in before this cron job existed — --dry-run, the required
#     REWARD_CYCLE_MAX_CENTS ceiling, the advisory-lock concurrency guard,
#     and structured per-referral logging (grep Render's log tab for
#     `REWARD_WORKER`).
#
# Deliberately does NOT declare the existing Stripe, database, Postmark,
# or Supabase env vars (DATABASE_URL, STRIPE_SECRET_KEY, STRIPE_API_BASE,
# GIFT_CARD_PROVIDER, SUPABASE_URL, SUPABASE_JWKS_URL, TRUST_PROXY,
# POSTMARK_SERVER_TOKEN, EMAIL_FROM_ADDRESS, FRONTEND_BASE_URL,
# TENANT_CREDENTIALS_ENCRYPTION_KEY, TREMENDOUS_API_BASE,
# STRIPE_WEBHOOK_SECRET) anywhere in this file — Blueprint sync only ever
# manages keys actually present here, so leaving all of these out keeps
# every value already configured in the dashboard untouched by any future
# sync of this file, on either service. See api/.env.example for what
# each one does. REWARD_CYCLE_MAX_CENTS below is the one exception: it's
# new, cron-specific, and has no existing dashboard value to protect.
services:
  - type: web
    name: 50.-Platform
    env: node
    plan: starter
    region: ohio
    branch: main
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

  - type: cron
    name: reward-issuance-worker
    env: node
    plan: starter
    region: ohio
    branch: main
    rootDir: api
    buildCommand: npm install
    startCommand: npm run reward-issuance
    # Hourly, on the hour — a starting point, not a fixed requirement.
    # The 7-day reward hold means nothing here is time-critical to the
    # minute; adjust once real spend volume makes a different cadence
    # matter (see api/README.md's "Not yet built" note on this exact
    # trade-off). Standard 5-field cron syntax, evaluated in UTC.
    schedule: "0 * * * *"
    envVars:
      # No default here, deliberately: the worker itself refuses to run
      # for real without this set (see rewardIssuance.js) rather than
      # silently picking an arbitrary ceiling for you. Decide the number,
      # then set it in the dashboard before this cron job's first real
      # (non-dry-run) execution. sync: false — Render prompts for the
      # value in the dashboard rather than reading it from this file.
      - key: REWARD_CYCLE_MAX_CENTS
        sync: false
