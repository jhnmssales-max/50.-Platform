<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>50. Reps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1C2B33; --primary-dark:#33475A; --secondary:#7C9FBB;
    --accent:#C9974B; --accent-dark:#8B6B2E; --bg:#F7F4EE; --charcoal:#1B1B1B; --muted:#6B6A63;
    --line:#E4DED3; --card:#FFFFFF; --danger:#A12B2B; --ok:#2B6B5A; --warn-bg:#FFF4D6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--charcoal);background:var(--bg);font-size:15px;line-height:1.45;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;color:var(--primary);margin:0;}
  h2{font-size:21px;} h3{font-size:17px;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .hide{display:none!important;}
  .muted{color:var(--muted);font-size:13px;}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

  /* sign-in */
  #loginBox{max-width:380px;margin:12vh auto 0;padding:0 16px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .brand .mark{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--primary);}
  .brand img,header.top img{height:44px;width:auto;display:block;}
  header.top img{height:38px;background:#fff;border-radius:50%;padding:2px;}
  .brand .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);font-weight:700;}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #CFC8BA;border-radius:8px;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--secondary);outline-offset:1px;}
  .btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.small{padding:5px 10px;font-size:13px;}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn:disabled{opacity:.55;cursor:default;}
  .msg{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:14px;display:none;}
  .msg.show{display:block;} .msg.err{background:#FBE4E4;color:var(--danger);} .msg.okmsg{background:#E3F3EA;color:var(--ok);}

  /* app */
  header.top{background:var(--primary);color:#fff;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
    header.top .who{margin-left:auto;font-size:13px;opacity:.92;}
  header.top button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;}
  nav.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto;}
  nav.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1 1 180px;min-width:0;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 12px;}
  .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  /* separate, not collapse: a collapsed table will not paint borders on a
     sticky cell, and the last column has to be sticky — see below. Every
     border here is a per-cell border-bottom, so this looks the same. */
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;}
  /* The last column holds the buttons — Resend login, Save, Mark won. On a
     narrow window the table is wider than its card, and those buttons were
     the part that got cut off, so the one thing you came to click was the one
     thing you had to go looking for. Pinned to the right edge instead, with a
     hairline so the columns sliding under it still read as a table. */
  .tablewrap tr > *:last-child{position:sticky;right:0;background:var(--card);}
  .tablewrap tr > *:last-child::after{content:'';position:absolute;left:0;top:0;bottom:0;
    width:1px;background:var(--line);}
  /* The action cell carries .num for its right alignment, and .num also
     carries white-space:nowrap -- so Edit/Won/Lost/More formed one 254px block
     that could not break at any width. That made the table's own minimum
     wider than the card holding it (1056 against 1046 at full width), and the
     sticky column above then sat on top of the Status heading and its pills.
     Letting the buttons wrap, and letting a long domain or email break, puts
     the table's minimum back under its container's width, so there is nothing
     for the sticky column to cover. */
  .tablewrap tbody tr > td:last-child{white-space:normal;}
  /* Wrapping alone squeezed the buttons into a 160px column -- Edit, Mark
     won, Lost and More stacked nearly one per line, which made every lead row
     118px tall and fitted four rows on a screen. Edit + Mark won is 147px of
     buttons, so 176 asks for a tidy two-by-two block. This is a width, not a
     min-width: when the window is too narrow to spare it the column gives it
     back rather than pushing the table past its card again. */
  .tablewrap thead th:last-child{width:176px;}
  /* Between the card breakpoint and about 980px the table's own minimum is
     still a little wider than its card, and the only thing holding it there
     is an email address or a domain -- one unbreakable word. Let those break
     in that band only, so a wide window keeps addresses whole. */
  @media (max-width:980px){
    .tablewrap td .muted{overflow-wrap:anywhere;}
    /* Closed by, Onboarded by and Start date each insisted on 140px, which
       is what held the Companies table 7px wider than its card at the
       narrowest desktop width. A rep's name still fits in 118. */
    .tablewrap td select,
    .tablewrap td input.startdate{min-width:118px;}
  }
  th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 12px;border-bottom:1px solid #F0EBE1;vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  td select{padding:6px 8px;min-width:140px;}
  td input.startdate{min-width:140px;}
  .pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:#EDE8DD;}
  .pill.open{background:#E6F0FA;color:#1F4E7A;} .pill.won{background:#E3F3EA;color:var(--ok);} .pill.lost{background:#F1E6E6;color:var(--danger);}
  .pill.off{background:#EEE;color:#777;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat b{display:block;font-size:24px;font-family:'Fraunces',serif;color:var(--primary);font-variant-numeric:tabular-nums;}
  .stat span{font-size:12px;color:var(--muted);}
  /* ---- calendar ----
     A month is a 7-column grid rather than a <table>: the cells are stacks of
     chips, not data in columns, and a grid lets a busy day grow taller without
     dragging every other cell in its row with it. At phone width the grid is
     hidden entirely (see the media query at the end) and the list below it is
     the whole tab, which is the right shape for reading between appointments. */
  .calhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;}
  .calhead h3{flex:1 1 auto;}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .calgrid .dow{background:var(--bg);padding:7px 8px;font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;}
  .calgrid .day{background:var(--card);min-height:84px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;}
  .calgrid .day.out{background:#FBF9F5;}
  .calgrid .day .dnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .calgrid .day.today{box-shadow:inset 0 0 0 2px var(--secondary);}
  .calgrid .day.today .dnum{color:var(--primary);font-weight:700;}
  /* A chip has to stay inside its column at every width, so it wraps rather
     than pushing the grid wider — min-width:0 on the cell is what allows it. */
  .chip{font-size:12px;line-height:1.3;border-radius:6px;padding:2px 6px;text-align:left;
    border:0;cursor:pointer;background:#E6F0FA;color:#1F4E7A;font-weight:600;
    overflow-wrap:anywhere;width:100%;}
  .chip.done{background:#EDE8DD;color:var(--muted);text-decoration:line-through;font-weight:500;}
  .chip.late{background:#F8E7DA;color:#8A5A2B;}
  .chip.mile{background:#EFEDE7;color:var(--muted);font-weight:500;cursor:default;}
  .chip.mile.won{background:#E3F3EA;color:var(--ok);}
  /* The actionable list under the grid. */
  .duelist{display:flex;flex-direction:column;gap:8px;margin:6px 0 0;}
  .due{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;}
  .due.overdue{border-color:#E8C9A8;background:#FFFAF4;}
  .due .when{flex:0 0 112px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .due .what{flex:1 1 auto;min-width:0;}
  .due .what b{font-weight:600;}
  .due .what p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  .due .btn{flex:0 0 auto;}
  /* ---- phone ----
     Two things have to change below ~560px.

     A table wide enough for six columns can only scroll sideways here, and
     because the actions column is sticky it parks the buttons on top of the
     content: you end up looking at a column of Wording / Files / Mark won with
     no idea which company any of them belongs to. So each row becomes its own
     card instead, read top to bottom, with its buttons underneath.

     And the month grid was simply hidden, which left the tab showing arrows
     that changed a heading above nothing at all. A 7-column grid does fit —
     what does not fit is a chip with words in it, so each item becomes a dot
     and the list underneath stays the part you act on. */
  /* Raised from 560px. At 700px the table kept its min-width and its sticky
     action column, so the buttons sat on top of Contact, Found and Status --
     the cards are the readable layout well before a phone's width. */
  @media (max-width:860px){
    .tablewrap{overflow-x:visible;background:transparent;border:0;border-radius:0;}
    table{min-width:0;display:block;}
    thead{display:none;}
    tbody{display:block;}
    tbody tr{display:block;background:var(--card);border:1px solid var(--line);
      border-radius:12px;padding:12px 14px;margin:0 0 10px;}
    tbody tr > td{display:block;border:0;padding:2px 0;}
    tbody tr > td:empty{display:none;}
    /* `display:block` above is an author rule, so it beats the browser's
       built-in [hidden]{display:none} -- which meant search set tr.hidden on
       a phone and every row stayed on screen while the counter read "3 of
       412". It worked on desktop, which is why it survived this long. */
    tbody tr[hidden]{display:none!important;}
    td.num{text-align:left;}
    /* The actions cell: a wrapped row of buttons under a hairline, and never
       sticky — there is nothing to stick to once the row is a card. */
    .tablewrap tbody tr > td:last-child{position:static;background:transparent;
      display:flex;flex-wrap:wrap;gap:6px;align-items:center;
      margin-top:8px;padding-top:10px;border-top:1px solid var(--line);}
    .tablewrap tbody tr > td:last-child:empty{display:none;}
    .tablewrap tr > *:last-child::after{display:none;}
    .tablewrap tbody tr > td:last-child select,
    .tablewrap tbody tr > td:last-child input{flex:1 1 140px;min-width:0;}
    /* The first cell carries the name, so give it the weight a heading has. */
    tbody tr > td:first-child{font-size:16px;font-weight:600;padding-bottom:4px;}
    /* ...but whatever sits under the name in that cell is a note, not part of
       the heading, so it does not inherit the weight. */
    tbody tr > td:first-child .muted{font-weight:400;font-size:13px;}
    tbody tr[data-empty-row] > td{font-size:15px;font-weight:400;text-align:left;}

    /* The month, at a size that fits a phone. */
    .calgrid .dow{padding:5px 2px;font-size:10px;}
    .calgrid .day{min-height:50px;padding:4px 3px;gap:2px;}
    .calgrid .day .dnum{font-size:11px;}
    /* A 7px dot has no room for a tint, so each one takes the solid version of
       the colour its chip carries on a wide screen. */
    .chip{font-size:0;line-height:0;width:8px;height:8px;min-height:8px;padding:0;
      border-radius:50%;display:inline-block;flex:0 0 auto;background:#1F4E7A;}
    .chip.late{background:#B4702E;}
    .chip.done{background:#B8B2A4;text-decoration:none;}
    .chip.mile{background:#8E887B;}
    .chip.mile.won{background:var(--ok);}
    .daydots{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;}
    /* A column of em-dashes standing in for columns that are not there. */
    .nomob{display:none!important;}
    /* Where a cell only makes sense under its column heading, carry the
       heading with it: the label on the left, the figure on the right. */
    tbody tr > td[data-label]{display:flex;justify-content:space-between;
      align-items:baseline;gap:12px;}
    tbody tr > td[data-label]::before{content:attr(data-label);
      color:var(--muted);font-size:13px;font-weight:400;flex:0 0 auto;}
    /* Anything after the value -- a phone, an email, "onboarded by Willy",
       the age of a lead -- goes on its own line under it, rather than strung
       out across the card where it reads as four unlabelled columns. */
    tbody tr > td[data-label]{flex-wrap:wrap;row-gap:2px;}
    tbody tr > td[data-label] > div{flex:1 1 100%;text-align:right;}
    /* A dropdown takes the rest of the line, and leaves the label whole:
       "Closed by" was breaking across two lines to make room for it. */
    tbody tr > td[data-label] select,
    tbody tr > td[data-label] input{flex:1 1 auto;min-width:0;max-width:100%;}
    /* Buttons on their own line, so one row never reads as two. */
    .due{flex-wrap:wrap;}
    .due .when{flex:1 1 100%;}
    .due .what{flex:1 1 100%;}
    .due .btn{flex:0 0 auto;}
    .calhead h3{flex:1 1 100%;}
    /* Tighter tabs: "Companies" was being cut mid-word at the edge. */
    nav.tabs{padding:8px 12px 0;gap:0;}
    nav.tabs button{padding:9px 11px;font-size:14px;}
  }
  .notice{background:var(--warn-bg);border:1px solid #E8D79C;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;}
  .neg{color:var(--danger);}
  /* A figure worth noticing without being an error: a dealer gone quiet, a
     renewal coming up, a missing card. Weight as well as colour, so it does
     not rely on colour alone to carry the point. */
  .warn{color:#8A5A00;font-weight:bold;}
  .tickcell{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .tickcell input{margin:0;flex:0 0 auto;}
  .tickcell input:disabled + span{opacity:.55;}
  .tickcell:has(input:disabled){cursor:default;}
  dialog{border:0;border-radius:14px;padding:22px;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35);}
  dialog.wide{max-width:900px;}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
  .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  details.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;}
  details.card summary{cursor:pointer;font-weight:600;color:var(--primary);}
  /* the wording a rep collects: grouped by the stage a customer meets it in,
     each box followed by a line saying where that sentence shows up. */
  details.wording{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:14px 0 4px;}
  details.wording summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--primary);}

  /* The wording wizard. Three steps, because nine boxes at once is what reps
     found overwhelming, and a picture of the real page beside each box,
     because the hard part was never the typing -- it was not knowing where
     the words come out. See api/scripts/build-wording-shots.js for where the
     pictures and the pin coordinates come from. */
  .wiz{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;margin:10px 0 2px;}
  .wizsteps{display:flex;border-bottom:1px solid var(--line);background:var(--bg);}
  .wstep{flex:1;min-width:0;border:0;background:none;cursor:pointer;font:inherit;font-size:12px;
         padding:9px 8px;color:var(--muted);border-bottom:2px solid transparent;text-align:center;}
  .wstep .n{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--line);color:var(--primary);
            align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-right:5px;vertical-align:-3px;}
  .wstep.on{color:var(--primary);font-weight:600;border-bottom-color:var(--accent);background:var(--card);}
  .wstep.on .n{background:var(--accent);color:#fff;}
  .wstep.done .n{background:var(--ok);color:#fff;}
  .wpane{display:none;padding:14px;gap:16px;}
  .wpane.on{display:flex;align-items:flex-start;}
  /* A FIXED height, not max-height: the picture arrives after the boxes are
     already on screen, and in the stacked phone layout it sits above them.
     Sized only by its content, the panel is ~60px of "Loading..." until the
     image lands and then jumps to full height, shoving every box below it
     down by about 200px -- which lands a rep's tap on the wrong control.
     Holding the space from the first paint costs nothing and stops that.
     position:relative is what the pin below is absolutely placed against. */
  .wshot{flex:0 0 42%;border:1px solid var(--line);border-radius:9px;background:var(--bg);
         height:340px;display:flex;flex-direction:column;overflow:hidden;}
  /* The scrolling half, and what the pin is absolutely placed against. Kept
     separate from .wshot so the caption below can stay a fixed row rather
     than floating wherever a short picture happens to end. */
  .wscroll{flex:1;min-height:0;overflow:auto;position:relative;}
  .wscroll img{display:block;width:100%;}
  .wshot.zoom .wscroll img{width:auto;max-width:none;}
  .wshotmsg{margin:0;padding:22px 14px;text-align:center;font-size:12px;color:var(--muted);}
  .wshotcap{flex:0 0 auto;font-size:11px;color:var(--muted);padding:6px 9px;border-top:1px solid var(--line);
            background:var(--card);display:flex;justify-content:space-between;gap:8px;}
  .wpin{position:absolute;outline:2px solid var(--accent);background:rgba(201,151,75,.22);border-radius:3px;
        box-shadow:0 0 0 3000px rgba(27,43,51,.26);pointer-events:none;}
  .wfields{flex:1;min-width:0;}
  .wbox{padding:0 0 14px;}
  .wbox + .wbox{border-top:1px dashed var(--line);padding-top:14px;}
  .wbox.act label{color:var(--accent-dark);}
  .wrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:5px 0 0;}
  .wcount{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;}
  /* The whole point of the rebuild: six of the nine boxes are fragments that
     finish a sentence the rep could not see. This shows that sentence. */
  .wprev{margin:7px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);
         border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.55;color:var(--primary-dark);}
  .wprev b{background:#FFF4D6;padding:0 3px;border-radius:3px;font-weight:600;color:var(--charcoal);}
  .wprev.gen{color:var(--muted);}
  .wprev.gen b{background:var(--line);color:var(--muted);font-weight:500;}
  .wnav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);}
  .wpos{font-size:12px;color:var(--muted);margin:0 auto;}
  /* On a phone the tab labels do not fit, so the tabs become numbered dots
     and the step name moves into the pane -- a rep must never be looking at
     three bare numbers wondering which page they are wording. */
  .wtitle{display:none;}
  @media(max-width:560px){
    .wpane.on{display:block;}
    .wshot{height:230px;margin:0 0 12px;}
    .wstep{font-size:0;padding:11px 4px;}
    .wstep .n{font-size:11px;margin:0;width:20px;height:20px;}
    .wstep.on{border-bottom-width:3px;}
    .wtitle{display:block;margin:0 0 10px;font-weight:600;font-size:13px;color:var(--primary);}
  }
  .stagehead{font-family:'Fraunces',serif;font-weight:600;color:var(--primary);font-size:14px;
    margin:16px 0 0;padding-top:10px;border-top:1px solid var(--line);}
  .stagehead:first-of-type{border-top:0;padding-top:0;margin-top:8px;}
  .hint{color:var(--muted);font-size:12px;margin:4px 0 0;}
  .searchrow{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
  .searchbox{flex:1 1 260px;max-width:420px;min-width:0;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);font:inherit;color:var(--charcoal);}
  .searchbox:focus{outline:2px solid var(--secondary);outline-offset:-1px;}
  .linkish{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--primary);
    font-weight:600;border-bottom:1px solid var(--line);}
  .linkish:hover{border-bottom-color:var(--primary);}
  .reads{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    margin:6px 0 0;font-size:13px;}
  .reads b{font-weight:600;}
  /* charts: drawn as plain SVG, no library, so they print and theme like the
     rest of the page rather than like somebody else's widget. */
  .chartcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .chartcard h3{font-size:15px;margin-bottom:2px;}
  .chartcard .muted{margin-bottom:10px;}
  .chartwrap{overflow-x:auto;}
  svg.chart{display:block;width:100%;min-width:520px;height:auto;font-family:'Inter',system-ui,sans-serif;}
  svg.chart text{fill:var(--muted);font-size:11px;}

  @media print{ header.top,nav.tabs,.noprint{display:none!important;} body{background:#fff;} }
</style>

<script>
// The lines to change per deployment: where the API is served, and the
// Supabase project the sign-in goes to. The anon key is meant to be public.
const API_BASE = "https://five0-platform.onrender.com/api";
const SUPABASE_URL = "https://jzjmuttqbtandwjmwwfn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RE92j36ZEVFvSBwV-Rl8hg_JyfxRT6a";

const TZ = 'America/New_York';
const state = { me: null, isAdmin: false, isRep: false, myRepId: null, reps: [], leads: [], dealers: [], builds: [], company: null, money: null, month: null, tab: 'leads', settings: null, calMonth: null, calItems: [] };

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dollars(cents){
  const n = (Number(cents) || 0) / 100;
  const s = Math.abs(n).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  return n < 0 ? '−' + s : s;
}
function dollarCell(cents){ return '<span class="' + (cents < 0 ? 'neg' : '') + '">' + dollars(cents) + '</span>'; }
function dateOnly(d){ return d ? new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', timeZone: TZ }) : ''; }
function plainDate(ymd){ if(!ymd) return ''; const [y,m,d] = String(ymd).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y, m-1, d)).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', timeZone:'UTC' }); }
function monthLabel(ym){ const [y,m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m-1, 1)).toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' }); }
function flash(text, ok){ const el = $('appMsg'); el.textContent = text; el.className = 'msg show ' + (ok ? 'okmsg' : 'err'); if(ok) setTimeout(() => { el.className = 'msg'; }, 3500); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function clearFlash(){ $('appMsg').className = 'msg'; }
// "how long ago", in the units a person actually uses. Eastern, like every
// other date on this page.
function daysSince(iso){
  if(!iso) return null;
  const then = new Date(iso);
  if(isNaN(then)) return null;
  const a = new Date(todayYmd() + 'T00:00:00Z');
  const b = new Date(String(iso).slice(0,10) + 'T00:00:00Z');
  return Math.max(0, Math.round((a - b) / 86400000));
}
function agoText(iso){
  const d = daysSince(iso);
  if(d === null) return '';
  if(d === 0) return 'today';
  if(d === 1) return 'yesterday';
  if(d < 31) return d + ' days ago';
  const m = Math.round(d / 30.44);
  return m <= 1 ? 'about a month ago' : m + ' months ago';
}
// Wraps a click handler so the button is disabled while it runs. Without this
// an impatient second tap on a slow connection sends the request twice --
// which for "reverse this earning" or "delete this payment" means doing it
// twice to what a rep is owed. Re-enables in a finally so a thrown error
// leaves a usable button behind.
function once(btn, fn){
  return async (ev) => {
    if(btn.disabled) return;
    btn.disabled = true;
    try{ await fn(ev); }
    finally{ btn.disabled = false; }
  };
}
// An error raised while a dialog is open used to go through flash(), which
// writes into the page BEHIND the modal backdrop and scrolls there -- so the
// dialog closed, everything typed was lost, and the reason appeared somewhere
// the person could not see. This keeps the dialog open and puts the reason in
// it. Falls back to flash() when no dialog is open.
function dialogError(text){
  const d = $('dlg');
  if(!d || !d.open){ flash(text); return; }
  let el = d.querySelector('[data-dlg-msg]');
  if(!el){
    el = document.createElement('div');
    el.setAttribute('data-dlg-msg', '');

}
function repName(id){ const r = state.reps.find((x) => x.id === id); return r ? r.name : ''; }
function repOptions(selected, { blank = '— none —', activeOnly = false } = {}){

  return '<option value="">' + esc(blank) + '</option>' + list.map((r) => '<option value="' + r.id + '"' + (r.id === selected ? ' selected' : '') + '>' + esc(r.name) + (r.active ? '' : ' (inactive)') + '</option>').join('');
}

/* ---------- auth (same Supabase sign-in as the dealer page) ---------- */
function getSession(){ try{ return JSON.parse(localStorage.getItem('fifty:reps-session') || 'null'); }catch(e){ return null; } }
function setSession(s){ try{ if(s) localStorage.setItem('fifty:reps-session', JSON.stringify(s)); else localStorage.removeItem('fifty:reps-session'); }catch(e){} }
async function authRequest(grant, body){
  const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=' + grant, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Sign-in failed.');
  return data;
}
async function refreshSession(){
  const s = getSession();
  if(!s || !s.refresh_token) return false;
  try{ const d = await authRequest('refresh_token', { refresh_token: s.refresh_token }); setSession({ access_token: d.access_token, refresh_token: d.refresh_token }); return true; }catch(e){ return false; }
}
async function api(path, options = {}, retried){
  const s = getSession();
  const res = await fetch(API_BASE + path, { ...options, headers: { 'Content-Type':'application/json', ...(s ? { Authorization: 'Bearer ' + s.access_token } : {}), ...(options.headers || {}) } });
  if(res.status === 401 && !retried && await refreshSession()) return api(path, options, true);
  let body = null; try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error((body && body.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status; err.code = body && body.code; err.body = body;
    throw err;
  }
  return body;
}
function post(path, data){ return api(path, { method:'POST', body: JSON.stringify(data || {}) }); }
function patch(path, data){ return api(path, { method:'PATCH', body: JSON.stringify(data || {}) }); }
function put(path, data){ return api(path, { method:'PUT', body: JSON.stringify(data || {}) }); }

$('loginForm').addEventListener('submit', async (e) => {

/* ---------- arriving from an emailed link ---------- */
// Supabase sends someone back here after they click "Set your password" with
// the session in the URL's fragment (#access_token=…&type=recovery) rather
// than in a query string, so it never reaches a server, ours included.
// Without reading it, the person lands on a sign-in form holding a password
// they have not set yet — which is exactly what happened the first time this
// shipped.
function readAuthFragment(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw) return null;
  let p;
  try{ p = new URLSearchParams(raw); }catch(e){ return null; }
  const error = p.get('error_description') || p.get('error');
  if(error) return { error: decodeURIComponent(error).replace(/\+/g, ' ') };
  const access_token = p.get('access_token');
  if(!access_token) return null;
  return { access_token, refresh_token: p.get('refresh_token') || '', type: p.get('type') || '' };
}

// Take it straight back out of the address bar: a session in a URL is a
// session in the browser history, in a bookmark, and in anything they paste.
function clearFragment(){
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
}

/* ---------- start ---------- */
async function start(){
  try{
    state.me = await api('/me');

        ? 'This login has been switched off. Ask Joseph to turn it back on.'

      m.className = 'msg show err';
      return showLogin();
    }
    if(err.status === 401){ setSession(null); return showLogin(); }
    const m = $('loginMsg'); m.textContent = err.message; m.className = 'msg show err'; return showLogin();
  }
  state.isAdmin = state.me.role === 'admin';
  state.isRep = state.me.role === 'rep';
  state.myRepId = state.isRep && state.reps.length ? state.reps[0].id : null;
  $('who').textContent = state.me.name + ' · ' + (state.isAdmin ? 'admin' : state.isRep ? 'rep' : 'helper');
  $('loginBox').classList.add('hide'); $('app').classList.remove('hide');
  // A rep runs their own pipeline: their leads, their dealers, their money.

  const tabs = state.isRep
    ? [['calendar','Calendar'],['leads','My leads'],['dealers','My dealers'],['mymoney','My money']]
    : [['calendar','Calendar'],['leads','Leads'],['reps','Reps'],['dealers','Companies']];
  if(state.isAdmin) tabs.push(['builds','Build dashboards'], ['money','Money'], ['company','Finances']);
  $('tabs').innerHTML = tabs.map(([k,l]) => '<button type="button" data-tab="' + k + '">' + l + '</button>').join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
  showTab(state.tab);
}
function showLogin(){ $('loginBox').classList.remove('hide'); $('app').classList.add('hide'); }

async function loadReps(){ const d = await api('/reps'); state.reps = d.reps; state.month = d.month || state.month; }

async function showTab(tab){

/* ---------- dialog ---------- */
function openDialog(html, { wide = false } = {}){

  d.innerHTML = html;

/* ---------- calendar ---------- */
// Two views of the same fetch. The month grid is for seeing what happened and
// what is coming; the list under it is the part you act on, and is all there is
// at phone width. Milestones are read-only — they are a record of something
// that already happened, not a task.
//
// Dates are handled as plain YYYY-MM-DD strings throughout and built from the
// LOCAL date parts, never toISOString(), which is UTC: at 8pm Eastern that
// would already be tomorrow and every item would land a day late.
const CAL_KINDS = {
  lead_added:   { verb: 'Lead added', cls: ''     },
  lead_won:     { verb: 'Signed up',  cls: 'won'  },
  dealer_built: { verb: 'Dashboard built', cls: '' },
  dealer_live:  { verb: 'Went live',  cls: 'won'  },
};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function isoDay(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayIso(){ return isoDay(new Date()); }
function addDays(iso, n){
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return isoDay(x);
}
function prettyDay(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d);
  return DOW[x.getDay()] + ' ' + MONTHS[m - 1].slice(0, 3) + ' ' + d;
}
function clockOf(t){
  if(!t) return '';
  const [h, mi] = String(t).split(':');
  const hr = Number(h);
  return (hr % 12 === 0 ? 12 : hr % 12) + ':' + mi + (hr < 12 ? 'am' : 'pm');
}
function daysBetween(a, b){
  return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
}

// The month being shown, as the 1st of it.
function calMonthStart(){
  if(!state.calMonth){ const n = new Date(); state.calMonth = isoDay(new Date(n.getFullYear(), n.getMonth(), 1)); }
  return state.calMonth;
}
function shiftMonth(by){
  const [y, m] = calMonthStart().split('-').map(Number);
  state.calMonth = isoDay(new Date(y, m - 1 + by, 1));
}

async function loadCalendar(){
  const start = calMonthStart();
  const [y, m] = start.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const gridFrom = addDays(start, -first.getDay());                 // back to Sunday
  const gridTo = addDays(gridFrom, 41);                             // six weeks covers any month
  // Widened so the list below can show things that fell due before the month
  // on screen, and anything set a little way ahead. One request, not three.
  const today = todayIso();
  const from = gridFrom < addDays(today, -60) ? gridFrom : addDays(today, -60);
  const to = gridTo > addDays(today, 60) ? gridTo : addDays(today, 60);
  const d = await api('/rep-calendar?from=' + from + '&to=' + to);
  state.calItems = d.items || [];
  return { gridFrom, gridTo };
}

function calChip(it){
  if(it.kind !== 'followup'){
    const k = CAL_KINDS[it.kind] || { verb: it.kind, cls: '' };
    return '<span class="chip mile ' + k.cls + '" title="' + esc(k.verb + ' — ' + it.title) + '">' + esc(it.title) + '</span>';
  }
  const late = !it.done && it.on_date < todayIso();
  const cls = it.done ? 'done' : late ? 'late' : '';
  return '<button type="button" class="chip ' + cls + '" data-fu="' + it.followup_id + '" title="' + esc(it.title) + '">'
    + (it.at_time ? esc(clockOf(it.at_time)) + ' ' : '') + esc(it.title) + '</button>';
}

function calGrid(gridFrom){
  const [y, m] = calMonthStart().split('-').map(Number);
  const byDay = {};
  for(const it of state.calItems){ (byDay[it.on_date] = byDay[it.on_date] || []).push(it); }
  const today = todayIso();
  let cells = DOW.map((d) => '<div class="dow">' + d + '</div>').join('');
  for(let i = 0; i < 42; i += 1){
    const iso = addDays(gridFrom, i);
    const inMonth = Number(iso.split('-')[1]) === m && Number(iso.split('-')[0]) === y;
    // Six rows always fit a month, but the last row is often entirely next
    // month — drop it rather than show a blank stripe.
    if(i >= 35 && !inMonth && !(byDay[iso] || []).length) continue;
    // The chips live in their own box so that at phone width, where each one
    // is a dot, they flow as a row under the date rather than a column.
    cells += '<div class="day' + (inMonth ? '' : ' out') + (iso === today ? ' today' : '') + '">'
      + '<span class="dnum">' + Number(iso.split('-')[2]) + '</span>'
      + '<div class="daydots">' + (byDay[iso] || []).map(calChip).join('') + '</div>'
      + '</div>';
  }
  return '<div class="calgrid">' + cells + '</div>';
}

// Overdue first, then today, then the next fortnight. Done items are left out:
// this is the list of what is left to do.
function dueList(){
  const today = todayIso();
  const horizon = addDays(today, 14);
  const open = state.calItems.filter((it) => it.kind === 'followup' && !it.done && it.on_date <= horizon);
  open.sort((a, b) => (a.on_date < b.on_date ? -1 : a.on_date > b.on_date ? 1 : String(a.at_time || '99').localeCompare(String(b.at_time || '99'))));
  if(!open.length){
    return '<p class="muted" id="dueEmpty">Nothing due in the next two weeks. Add a follow-up and it will show up here, and in your 7am email on the day.</p>';
  }
  return '<div class="duelist">' + open.map((it) => {
    const late = it.on_date < today;
    const gap = daysBetween(it.on_date, today);
    const when = late
      ? prettyDay(it.on_date) + ' · ' + gap + ' day' + (gap === 1 ? '' : 's') + ' ago'
      : it.on_date === today
        ? 'Today' + (it.at_time ? ' · ' + clockOf(it.at_time) : '')
        : prettyDay(it.on_date) + (it.at_time ? ' · ' + clockOf(it.at_time) : '');
    return '<div class="due' + (late ? ' overdue' : '') + '" data-due="' + it.followup_id + '">'
      + '<span class="when">' + esc(when) + '</span>'
      + '<span class="what"><b>' + esc(it.title) + '</b>'
      + (it.detail ? '<p>' + esc(it.detail) + '</p>' : '') + '</span>'
      + '<button type="button" class="btn small secondary" data-tick="' + it.followup_id + '">Done</button>'
      + '<button type="button" class="btn small secondary" data-fu="' + it.followup_id + '">Edit</button>'
      + '</div>';
  }).join('') + '</div>';
}

async function renderCalendar(){
  const { gridFrom } = await loadCalendar();
  const [y, m] = calMonthStart().split('-').map(Number);
  const mine = state.calItems.filter((it) => it.kind === 'followup' && !it.done).length;
  $('tab-calendar').innerHTML =
    '<div class="calhead">'
    + '<h3>' + MONTHS[m - 1] + ' ' + y + '</h3>'

    + '<button type="button" class="btn small secondary" id="calToday">This month</button>'
    + '<button type="button" class="btn small secondary" id="calNext">&rarr;</button>'
    + '<button type="button" class="btn small" id="calAdd">Add a follow-up</button>'
    + '</div>'
    + calGrid(gridFrom)
    + '<h3 style="margin:22px 0 2px;">What is left to do</h3>'
    + '<p class="muted">Your own follow-ups. A digest of whatever is due goes to '
    + esc(state.me && state.me.email ? state.me.email : 'your email') + ' at 7am on the day.</p>'
    + dueList()
    + '<p class="muted" style="margin-top:18px;">The marks on the month are things that already happened — a lead signing up, a dashboard being built, a dealer going live. '
    + (state.isRep ? 'Yours only.' : 'Every company’s.') + ' Follow-ups are only ever your own. On a phone each one is a dot.</p>';

  $('calPrev').addEventListener('click', () => { shiftMonth(-1); renderCalendar().catch((e) => flash(e.message)); });

async function tickFollowup(id, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    await api('/rep-followups/' + id, { method: 'PATCH', body: JSON.stringify({ done: true }) });
    await renderCalendar();
    flash('Ticked off.', true);
  }catch(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Done'; }
    flash(err.message);
  }
}

// One dialog for adding and for editing. `about` pre-fills what it is about
// when the follow-up is being set from a lead or a company row, so the rep
// does not retype the name.
function followupDialog(id, about){
  const it = id ? state.calItems.find((x) => x.followup_id === id) : null;
  const titleVal = it ? it.title : (about && about.title) || '';
  const noteVal = it ? (it.detail || '') : '';
  const dateVal = it ? it.on_date : addDays(todayIso(), 1);
  const timeVal = it && it.at_time ? String(it.at_time).slice(0, 5) : '';
  openDialog(
    '<h3>' + (it ? 'Follow-up' : 'Add a follow-up') + '</h3>'
    + '<p class="muted">Only you see this. It appears on your calendar and in your 7am email on the day.</p>'
    + '<label>What do you need to do?<input id="fuTitle" maxlength="200" placeholder="Call Dave back about the ramp" value="' + esc(titleVal) + '"></label>'
    + '<div class="row"><label>On<input id="fuDate" type="date" value="' + esc(dateVal) + '"></label>'
    + '<label>At (optional)<input id="fuTime" type="time" value="' + esc(timeVal) + '"></label></div>'
    + '<label>Notes (optional)<textarea id="fuNote" rows="3" maxlength="2000" placeholder="What you agreed, what to bring up">' + esc(noteVal) + '</textarea></label>'
    + '<div class="actions">'
    + (it && !it.done ? '<button type="button" class="btn secondary" id="fuDone">Mark done</button>' : '')
    + (it && it.done ? '<button type="button" class="btn secondary" id="fuUndone">Put it back</button>' : '')
    + (it ? '<button type="button" class="btn danger" id="fuDel">Delete</button>' : '')
    + '<button type="button" class="btn secondary" id="fuCancel">Cancel</button>'
    + '<button type="button" class="btn" id="fuSave">Save</button>'
    + '</div>'
  );
  $('fuCancel').addEventListener('click', closeDialog);

  const finish = async (fn, okText) => {
    const save = $('fuSave'); if(save) save.disabled = true;
    try{ await fn(); closeDialog(); await renderCalendar(); flash(okText, true); }
    catch(err){ if(save) save.disabled = false; flash(err.message); }
  };

  $('fuSave').addEventListener('click', () => {
    const title = $('fuTitle').value.trim();
    const due_on = $('fuDate').value;
    if(!title){ flash('Say what you need to do.'); return; }
    if(!due_on){ flash('Pick a date.'); return; }
    const body = { title, due_on, due_time: $('fuTime').value || null, note: $('fuNote').value.trim() || null };
    finish(
      // api() hands `options` straight to fetch, so a body has to be a string
      // already — an object there is sent as "[object Object]".
      () => id
        ? api('/rep-followups/' + id, { method: 'PATCH', body: JSON.stringify(body) })
        : api('/rep-followups', { method: 'POST', body: JSON.stringify({ ...body, lead_id: (about && about.lead_id) || null, tenant_id: (about && about.tenant_id) || null }) }),
      id ? 'Saved.' : 'Follow-up set.'
    );
  });
  if($('fuDone')) $('fuDone').addEventListener('click', () => finish(() => api('/rep-followups/' + id, { method: 'PATCH', body: JSON.stringify({ done: true }) }), 'Ticked off.'));
  if($('fuUndone')) $('fuUndone').addEventListener('click', () => finish(() => api('/rep-followups/' + id, { method: 'PATCH', body: JSON.stringify({ done: false }) }), 'Back on your list.'));
  if($('fuDel')) $('fuDel').addEventListener('click', () => finish(() => api('/rep-followups/' + id, { method: 'DELETE' }), 'Deleted.'));
}

/* ---------- what a dealer pays ---------- */
// Shared by the build screen and the Companies-tab dialog, so a price means
// the same thing in both places and there is one list to keep right.
// `v` is a tenant's current pricing, or null on a build (standard terms).
const PRICE_FIELDS = [
  { key:'activation_fee_cents', label:'Onboarding charge ($)', std:500,
    hint:'Charged once, at their first sign-in. Covers their first year.' },
  { key:'annual_fee_cents', label:'Every year after ($)', std:100,
    hint:'Charged to the card on file on their anniversary.' },
  { key:'referral_fee_cents', label:'Your fee per referral ($)', std:30,
    hint:'A flat amount each time one is marked paid \u2014 not a percentage, so it does not shrink with the gift card.' },
];

function pricingFieldsHtml(v){
  const dollars = (key, std) => (v && v[key] != null) ? (v[key] / 100) : std;
  const boxes = PRICE_FIELDS.map((f) =>
    '<div><label>' + esc(f.label) + '</label>' +
      '<input name="price_' + f.key + '" type="number" min="0" max="10000" step="1" value="' + dollars(f.key, f.std) + '">' +
      '<p class="hint">' + esc(f.hint) + '</p></div>').join('');
  const platform = v ? v.reward_fulfillment === 'platform' : false;
  const charge = v ? !!v.charge_card_cost : false;
  const followup = (v && v.invite_followup_months != null) ? v.invite_followup_months : '';
  const money =
    '<div class="row">' + boxes + '</div>' +
    '<label>Who sends the gift cards</label>' +
    '<select name="reward_fulfillment">' +
      '<option value="dealer"' + (platform ? '' : ' selected') + '>They do \u2014 we email them, they send the cards</option>' +
      '<option value="platform"' + (platform ? ' selected' : '') + '>We do \u2014 we email the cards to their customer</option>' +
    '</select>' +
    '<p class="hint">Either way nothing goes out until they mark the referral paid.</p>' +
    '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px">' +
      '<input type="checkbox" name="charge_card_cost" style="width:auto;margin-top:3px"' + (charge ? ' checked' : '') + '>' +
      '<span>Also charge them for the gift cards themselves' +
      '<p class="hint" style="margin:2px 0 0">Tick this when you are buying the cards, so you are paid back for them on top of your fee. Leave it off when the cards are theirs to buy.</p></span>' +
    '</label>';

  // How often a customer is sent their link again is not a price, so it
  // shows for every company -- in-house included. North Mountain has 184
  // people invited and is the one list this matters most for.
  const followups =
    '<label style="margin-top:12px">Send invited customers their link again</label>' +
    '<select name="invite_followup_months">' +
      [['', 'Never \u2014 one invite only'], ['3', 'Every 3 months'], ['6', 'Every 6 months'],
       ['9', 'Every 9 months'], ['12', 'Every 12 months']].map((o) =>
        '<option value="' + o[0] + '"' + (String(followup) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'
      ).join('') +
    '</select>' +
    '<p class="hint">A short reminder with the same link, three times at most. Every referral email carries an unsubscribe link, and anyone who uses it is never emailed again by this company.</p>';

  return money + followups;
}

// Reads the boxes back as cents. On a build only what DIFFERS from the
// standard terms is sent, so a dealer Joseph did not price is created on the
// column defaults rather than on whatever the form happened to show.
function readPricingFields(form, { onlyChanges = false } = {}){
  const out = {};
  PRICE_FIELDS.forEach((f) => {
    const el = form.querySelector('[name="price_' + f.key + '"]');
    if(!el || el.value === '') return;
    const cents = Math.round(Number(el.value) * 100);
    if(!Number.isFinite(cents) || cents < 0) return;
    if(onlyChanges && cents === f.std * 100) return;
    out[f.key] = cents;
  });
  const sel = form.querySelector('[name="reward_fulfillment"]');
  if(sel && !(onlyChanges && sel.value === 'dealer')) out.reward_fulfillment = sel.value;
  const chk = form.querySelector('[name="charge_card_cost"]');
  if(chk && !(onlyChanges && !chk.checked)) out.charge_card_cost = chk.checked;
  // Empty means never. Sent as null rather than omitted, so turning it back
  // off actually turns it off instead of leaving the old value in place.
  const fu = form.querySelector('[name="invite_followup_months"]');
  if(fu && !(onlyChanges && fu.value === '')) {
    out.invite_followup_months = fu.value === '' ? null : Number(fu.value);
  }
  return out;
}

/* ---------- the wording a dealer's own customers read ---------- */
// Same nine lines, in the same order, as api/src/lib/tenantCopy.js — keep the
// two in step. A business never sees these labels; a rep does, sitting across
// from the owner, so each one says where the sentence turns up rather than
// what the key is called. `generic` is what runs if the box is left empty: it
// is deliberately trade-neutral, so a roofer whose rep typed nothing still
// never reads "buy a shed from us".
const COPY_FIELDS = [
  { key:'offerHow', stage:'Their invite email, and their share page', label:'How the program works, in a sentence or two', multiline:true, max:600,
