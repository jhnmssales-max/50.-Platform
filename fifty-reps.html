<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>50. Reps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1C2B33; --primary-dark:#33475A; --secondary:#7C9FBB;
    --accent:#C9974B; --accent-dark:#8B6B2E; --bg:#F7F4EE; --charcoal:#1B1B1B; --muted:#6B6A63;
    --line:#E4DED3; --card:#FFFFFF; --danger:#A12B2B; --ok:#2B6B5A; --warn-bg:#FFF4D6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--charcoal);background:var(--bg);font-size:15px;line-height:1.45;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;color:var(--primary);margin:0;}
  h2{font-size:21px;} h3{font-size:17px;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .hide{display:none!important;}
  .muted{color:var(--muted);font-size:13px;}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

  /* sign-in */
  #loginBox{max-width:380px;margin:12vh auto 0;padding:0 16px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .brand .mark{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--primary);}
  .brand img,header.top img{height:44px;width:auto;display:block;}
  header.top img{height:38px;background:#fff;border-radius:50%;padding:2px;}
  .brand .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);font-weight:700;}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #CFC8BA;border-radius:8px;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--secondary);outline-offset:1px;}
  .btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.small{padding:5px 10px;font-size:13px;}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn:disabled{opacity:.55;cursor:default;}
  .msg{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:14px;display:none;}
  .msg.show{display:block;} .msg.err{background:#FBE4E4;color:var(--danger);} .msg.okmsg{background:#E3F3EA;color:var(--ok);}

  /* app */
  header.top{background:var(--primary);color:#fff;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
    header.top .who{margin-left:auto;font-size:13px;opacity:.92;}
  header.top button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;}
  nav.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto;}
  nav.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1 1 180px;min-width:0;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 12px;}
  .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  /* separate, not collapse: a collapsed table will not paint borders on a
     sticky cell, and the last column has to be sticky — see below. Every
     border here is a per-cell border-bottom, so this looks the same. */
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;}
  /* The last column holds the buttons — Resend login, Save, Mark won. On a
     narrow window the table is wider than its card, and those buttons were
     the part that got cut off, so the one thing you came to click was the one
     thing you had to go looking for. Pinned to the right edge instead, with a
     hairline so the columns sliding under it still read as a table. */
  .tablewrap tr > *:last-child{position:sticky;right:0;background:var(--card);}
  .tablewrap tr > *:last-child::after{content:'';position:absolute;left:0;top:0;bottom:0;
    width:1px;background:var(--line);}
  th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 12px;border-bottom:1px solid #F0EBE1;vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  td select{padding:6px 8px;min-width:140px;}
  .pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:#EDE8DD;}
  .pill.open{background:#E6F0FA;color:#1F4E7A;} .pill.won{background:#E3F3EA;color:var(--ok);} .pill.lost{background:#F1E6E6;color:var(--danger);}
  .pill.off{background:#EEE;color:#777;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat b{display:block;font-size:24px;font-family:'Fraunces',serif;color:var(--primary);font-variant-numeric:tabular-nums;}
  .stat span{font-size:12px;color:var(--muted);}
  /* ---- calendar ----
     A month is a 7-column grid rather than a <table>: the cells are stacks of
     chips, not data in columns, and a grid lets a busy day grow taller without
     dragging every other cell in its row with it. At phone width the grid is
     hidden entirely (see the media query at the end) and the list below it is
     the whole tab, which is the right shape for reading between appointments. */
  .calhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;}
  .calhead h3{flex:1 1 auto;}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .calgrid .dow{background:var(--bg);padding:7px 8px;font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;}
  .calgrid .day{background:var(--card);min-height:84px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;}
  .calgrid .day.out{background:#FBF9F5;}
  .calgrid .day .dnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .calgrid .day.today{box-shadow:inset 0 0 0 2px var(--secondary);}
  .calgrid .day.today .dnum{color:var(--primary);font-weight:700;}
  /* A chip has to stay inside its column at every width, so it wraps rather
     than pushing the grid wider — min-width:0 on the cell is what allows it. */
  .chip{font-size:12px;line-height:1.3;border-radius:6px;padding:2px 6px;text-align:left;
    border:0;cursor:pointer;background:#E6F0FA;color:#1F4E7A;font-weight:600;
    overflow-wrap:anywhere;width:100%;}
  .chip.done{background:#EDE8DD;color:var(--muted);text-decoration:line-through;font-weight:500;}
  .chip.late{background:#F8E7DA;color:#8A5A2B;}
  .chip.mile{background:#EFEDE7;color:var(--muted);font-weight:500;cursor:default;}
  .chip.mile.won{background:#E3F3EA;color:var(--ok);}
  /* The actionable list under the grid. */
  .duelist{display:flex;flex-direction:column;gap:8px;margin:6px 0 0;}
  .due{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;}
  .due.overdue{border-color:#E8C9A8;background:#FFFAF4;}
  .due .when{flex:0 0 112px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .due .what{flex:1 1 auto;min-width:0;}
  .due .what b{font-weight:600;}
  .due .what p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  .due .btn{flex:0 0 auto;}
  @media (max-width:560px){
    .calgrid{display:none;}
    .due{flex-wrap:wrap;}
    .due .when{flex:1 1 100%;}
  }
  .notice{background:var(--warn-bg);border:1px solid #E8D79C;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;}
  .neg{color:var(--danger);}
  dialog{border:0;border-radius:14px;padding:22px;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35);}
  dialog.wide{max-width:900px;}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
  .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  details.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;}
  details.card summary{cursor:pointer;font-weight:600;color:var(--primary);}
  /* the wording a rep collects: grouped by the stage a customer meets it in,
     each box followed by a line saying where that sentence shows up. */
  details.wording{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:14px 0 4px;}
  details.wording summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--primary);}
  .stagehead{font-family:'Fraunces',serif;font-weight:600;color:var(--primary);font-size:14px;
    margin:16px 0 0;padding-top:10px;border-top:1px solid var(--line);}
  .stagehead:first-of-type{border-top:0;padding-top:0;margin-top:8px;}
  .hint{color:var(--muted);font-size:12px;margin:4px 0 0;}
  .searchrow{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
  .searchbox{flex:1 1 260px;max-width:420px;min-width:0;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);font:inherit;color:var(--charcoal);}
  .searchbox:focus{outline:2px solid var(--secondary);outline-offset:-1px;}
  .linkish{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--primary);
    font-weight:600;border-bottom:1px solid var(--line);}
  .linkish:hover{border-bottom-color:var(--primary);}
  .reads{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    margin:6px 0 0;font-size:13px;}
  .reads b{font-weight:600;}
  /* charts: drawn as plain SVG, no library, so they print and theme like the
     rest of the page rather than like somebody else's widget. */
  .chartcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .chartcard h3{font-size:15px;margin-bottom:2px;}
  .chartcard .muted{margin-bottom:10px;}
  .chartwrap{overflow-x:auto;}
  svg.chart{display:block;width:100%;min-width:520px;height:auto;font-family:'Inter',system-ui,sans-serif;}
  svg.chart text{fill:var(--muted);font-size:11px;}
  svg.chart text.val{fill:var(--charcoal);font-size:10px;font-variant-numeric:tabular-nums;}
  svg.chart .axis{stroke:var(--line);stroke-width:1;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  /* A twelve-month bar chart needs 520px before months start dropping off the
     end, so a column narrower than that is not a column worth having: the grid
     stacks instead. 260px fitted two charts into a dialog and cut November and
     December off both. */
  .reportgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:14px;align-items:start;}
  @media print{ header.top,nav.tabs,.noprint{display:none!important;} body{background:#fff;} }
</style>
</head>
<body>

<section id="loginBox">
  <div class="panel">
    <div class="brand"><img src="assets/50-platform-logo.png" alt="50."><span class="tag">Reps</span></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:16px"><button class="btn" type="submit" id="loginBtn">Sign in</button></div>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</section>

<section id="setPwBox" class="hide">
  <div class="panel">
    <div class="brand"><img src="assets/50-platform-logo.png" alt="50."><span class="tag">Reps</span></div>
    <p id="setPwWho" class="muted" style="margin:0 0 4px"></p>
    <h2 style="font-size:19px;margin-bottom:6px">Choose a password</h2>
    <p class="muted" style="margin:0 0 4px">This is what you will sign in with from now on. At least 8 characters.</p>
    <form id="setPwForm">
      <label for="newPw">New password</label>
      <input id="newPw" type="password" autocomplete="new-password" minlength="8" required>
      <label for="newPw2">Type it again</label>
      <input id="newPw2" type="password" autocomplete="new-password" minlength="8" required>
      <div style="margin-top:16px"><button class="btn" type="submit" id="setPwBtn">Save and sign in</button></div>
      <div id="setPwMsg" class="msg"></div>
    </form>
  </div>
</section>

<div id="app" class="hide">
  <header class="top">
    <img src="assets/50-platform-logo.png" alt="50."><span>Reps</span>
    <span class="who" id="who"></span>
    <button id="signOutBtn" type="button">Sign out</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main>
    <div id="appMsg" class="msg"></div>
    <section id="tab-calendar" class="hide"></section>
    <section id="tab-leads" class="hide"></section>
    <section id="tab-reps" class="hide"></section>
    <section id="tab-dealers" class="hide"></section>
    <section id="tab-money" class="hide"></section>
    <section id="tab-mymoney" class="hide"></section>
    <section id="tab-builds" class="hide"></section>
    <section id="tab-company" class="hide"></section>
  </main>
</div>

<dialog id="dlg"></dialog>

<script>
// The lines to change per deployment: where the API is served, and the
// Supabase project the sign-in goes to. The anon key is meant to be public.
const API_BASE = "https://five0-platform.onrender.com/api";
const SUPABASE_URL = "https://jzjmuttqbtandwjmwwfn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RE92j36ZEVFvSBwV-Rl8hg_JyfxRT6a";

const TZ = 'America/New_York';
const state = { me: null, isAdmin: false, isRep: false, myRepId: null, reps: [], leads: [], dealers: [], builds: [], company: null, money: null, month: null, tab: 'leads', settings: null, calMonth: null, calItems: [] };

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dollars(cents){
  const n = (Number(cents) || 0) / 100;
  const s = Math.abs(n).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  return n < 0 ? '−' + s : s;
}
function dollarCell(cents){ return '<span class="' + (cents < 0 ? 'neg' : '') + '">' + dollars(cents) + '</span>'; }
function dateOnly(d){ return d ? new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', timeZone: TZ }) : ''; }
function plainDate(ymd){ if(!ymd) return ''; const [y,m,d] = String(ymd).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y, m-1, d)).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', timeZone:'UTC' }); }
function monthLabel(ym){ const [y,m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m-1, 1)).toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' }); }
function flash(text, ok){ const el = $('appMsg'); el.textContent = text; el.className = 'msg show ' + (ok ? 'okmsg' : 'err'); if(ok) setTimeout(() => { el.className = 'msg'; }, 3500); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function clearFlash(){ $('appMsg').className = 'msg'; }
function repName(id){ const r = state.reps.find((x) => x.id === id); return r ? r.name : ''; }
function repOptions(selected, { blank = '— none —', activeOnly = false } = {}){
  const list = state.reps.filter((r) => !activeOnly || r.active || r.id === selected);
  return '<option value="">' + esc(blank) + '</option>' + list.map((r) => '<option value="' + r.id + '"' + (r.id === selected ? ' selected' : '') + '>' + esc(r.name) + (r.active ? '' : ' (inactive)') + '</option>').join('');
}

/* ---------- auth (same Supabase sign-in as the dealer page) ---------- */
function getSession(){ try{ return JSON.parse(localStorage.getItem('fifty:reps-session') || 'null'); }catch(e){ return null; } }
function setSession(s){ try{ if(s) localStorage.setItem('fifty:reps-session', JSON.stringify(s)); else localStorage.removeItem('fifty:reps-session'); }catch(e){} }
async function authRequest(grant, body){
  const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=' + grant, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Sign-in failed.');
  return data;
}
async function refreshSession(){
  const s = getSession();
  if(!s || !s.refresh_token) return false;
  try{ const d = await authRequest('refresh_token', { refresh_token: s.refresh_token }); setSession({ access_token: d.access_token, refresh_token: d.refresh_token }); return true; }catch(e){ return false; }
}
async function api(path, options = {}, retried){
  const s = getSession();
  const res = await fetch(API_BASE + path, { ...options, headers: { 'Content-Type':'application/json', ...(s ? { Authorization: 'Bearer ' + s.access_token } : {}), ...(options.headers || {}) } });
  if(res.status === 401 && !retried && await refreshSession()) return api(path, options, true);
  let body = null; try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error((body && body.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status; err.code = body && body.code; err.body = body;
    throw err;
  }
  return body;
}
function post(path, data){ return api(path, { method:'POST', body: JSON.stringify(data || {}) }); }
function patch(path, data){ return api(path, { method:'PATCH', body: JSON.stringify(data || {}) }); }
function put(path, data){ return api(path, { method:'PUT', body: JSON.stringify(data || {}) }); }

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('loginBtn'), msg = $('loginMsg');
  btn.disabled = true; msg.className = 'msg';
  try{
    const d = await authRequest('password', { email: $('email').value.trim(), password: $('password').value });
    setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
    await start();
  }catch(err){ msg.textContent = err.message; msg.className = 'msg show err'; }
  btn.disabled = false;
});
$('signOutBtn').addEventListener('click', () => { setSession(null); location.reload(); });

/* ---------- arriving from an emailed link ---------- */
// Supabase sends someone back here after they click "Set your password" with
// the session in the URL's fragment (#access_token=…&type=recovery) rather
// than in a query string, so it never reaches a server, ours included.
// Without reading it, the person lands on a sign-in form holding a password
// they have not set yet — which is exactly what happened the first time this
// shipped.
function readAuthFragment(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw) return null;
  let p;
  try{ p = new URLSearchParams(raw); }catch(e){ return null; }
  const error = p.get('error_description') || p.get('error');
  if(error) return { error: decodeURIComponent(error).replace(/\+/g, ' ') };
  const access_token = p.get('access_token');
  if(!access_token) return null;
  return { access_token, refresh_token: p.get('refresh_token') || '', type: p.get('type') || '' };
}

// Take it straight back out of the address bar: a session in a URL is a
// session in the browser history, in a bookmark, and in anything they paste.
function clearFragment(){
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
}

function showSetPassword(email){
  $('loginBox').classList.add('hide');
  $('app').classList.add('hide');
  $('setPwBox').classList.remove('hide');
  $('setPwWho').textContent = email ? 'Signed in as ' + email : '';
}

async function whoAmI(){
  try{
    const s = getSession();
    const res = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + s.access_token } });
    if(!res.ok) return null;
    const d = await res.json();
    return d.email || null;
  }catch(e){ return null; }
}

$('setPwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('setPwBtn'), msg = $('setPwMsg');
  const a = $('newPw').value, b = $('newPw2').value;
  msg.className = 'msg';
  if(a !== b){ msg.textContent = 'Those two do not match.'; msg.className = 'msg show err'; return; }
  btn.disabled = true;
  try{
    const s = getSession();
    const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + s.access_token },
      body: JSON.stringify({ password: a }),
    });
    const body = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(body.msg || body.error_description || body.message || 'That password was not accepted.');
    $('setPwBox').classList.add('hide');
    await start();
  }catch(err){
    msg.textContent = err.message; msg.className = 'msg show err';
    btn.disabled = false;
  }
});

/* ---------- start ---------- */
async function start(){
  try{
    state.me = await api('/me');
    // /reps is for 50. staff only; anyone else (a dealer's login) gets a 403.
    await loadReps();
  }catch(err){
    if(err.status === 403){
      setSession(null);
      const m = $('loginMsg');
      m.textContent = err.code === 'rep_inactive'
        ? 'This login has been switched off. Ask Joseph to turn it back on.'
        : 'This page is only for 50. staff and reps. Sign in with the login 50. sent you.';
      m.className = 'msg show err';
      return showLogin();
    }
    if(err.status === 401){ setSession(null); return showLogin(); }
    const m = $('loginMsg'); m.textContent = err.message; m.className = 'msg show err'; return showLogin();
  }
  state.isAdmin = state.me.role === 'admin';
  state.isRep = state.me.role === 'rep';
  state.myRepId = state.isRep && state.reps.length ? state.reps[0].id : null;
  $('who').textContent = state.me.name + ' · ' + (state.isAdmin ? 'admin' : state.isRep ? 'rep' : 'helper');
  $('loginBox').classList.add('hide'); $('app').classList.remove('hide');
  // A rep runs their own pipeline: their leads, their dealers, their money.
  // No Reps tab (there is only them) and no Money tab (that is everyone's).
  // Calendar sits first because it reads first — what you owe someone today,
  // before the lists of everything. The page still OPENS on Leads, which is
  // where everyone's habit already is; adding a tab should not move the
  // furniture. Change state.tab's default to 'calendar' to open on it.
  const tabs = state.isRep
    ? [['calendar','Calendar'],['leads','My leads'],['dealers','My dealers'],['mymoney','My money']]
    : [['calendar','Calendar'],['leads','Leads'],['reps','Reps'],['dealers','Companies']];
  if(state.isAdmin) tabs.push(['builds','Build dashboards'], ['money','Money'], ['company','Finances']);
  $('tabs').innerHTML = tabs.map(([k,l]) => '<button type="button" data-tab="' + k + '">' + l + '</button>').join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
  showTab(state.tab);
}

/* ---------- calendar ---------- */
// Two views of the same fetch. The month grid is for seeing what happened and
// what is coming; the list under it is the part you act on, and is all there is
// at phone width. Milestones are read-only — they are a record of something
// that already happened, not a task.
//
// Dates are handled as plain YYYY-MM-DD strings throughout and built from the
// LOCAL date parts, never toISOString(), which is UTC: at 8pm Eastern that
// would already be tomorrow and every item would land a day late.
const CAL_KINDS = {
  lead_won:     { verb: 'Signed up',  cls: 'won'  },
  dealer_built: { verb: 'Dashboard built', cls: '' },
  dealer_live:  { verb: 'Went live',  cls: 'won'  },
};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function isoDay(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayIso(){ return isoDay(new Date()); }
function addDays(iso, n){
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return isoDay(x);
}
function prettyDay(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d);
  return DOW[x.getDay()] + ' ' + MONTHS[m - 1].slice(0, 3) + ' ' + d;
}
function clockOf(t){
  if(!t) return '';
  const [h, mi] = String(t).split(':');
  const hr = Number(h);
  return (hr % 12 === 0 ? 12 : hr % 12) + ':' + mi + (hr < 12 ? 'am' : 'pm');
}
function daysBetween(a, b){
  return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
}

// The month being shown, as the 1st of it.
function calMonthStart(){
  if(!state.calMonth){ const n = new Date(); state.calMonth = isoDay(new Date(n.getFullYear(), n.getMonth(), 1)); }
  return state.calMonth;
}
function shiftMonth(by){
  const [y, m] = calMonthStart().split('-').map(Number);
  state.calMonth = isoDay(new Date(y, m - 1 + by, 1));
}

async function loadCalendar(){
  const start = calMonthStart();
  const [y, m] = start.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const gridFrom = addDays(start, -first.getDay());                 // back to Sunday
  const gridTo = addDays(gridFrom, 41);                             // six weeks covers any month
  // Widened so the list below can show things that fell due before the month
  // on screen, and anything set a little way ahead. One request, not three.
  const today = todayIso();
  const from = gridFrom < addDays(today, -60) ? gridFrom : addDays(today, -60);
  const to = gridTo > addDays(today, 60) ? gridTo : addDays(today, 60);
  const d = await api('/rep-calendar?from=' + from + '&to=' + to);
  state.calItems = d.items || [];
  return { gridFrom, gridTo };
}

function calChip(it){
  if(it.kind !== 'followup'){
    const k = CAL_KINDS[it.kind] || { verb: it.kind, cls: '' };
    return '<span class="chip mile ' + k.cls + '" title="' + esc(k.verb + ' — ' + it.title) + '">' + esc(it.title) + '</span>';
  }
  const late = !it.done && it.on_date < todayIso();
  const cls = it.done ? 'done' : late ? 'late' : '';
  return '<button type="button" class="chip ' + cls + '" data-fu="' + it.followup_id + '" title="' + esc(it.title) + '">'
    + (it.at_time ? esc(clockOf(it.at_time)) + ' ' : '') + esc(it.title) + '</button>';
}

function calGrid(gridFrom){
  const [y, m] = calMonthStart().split('-').map(Number);
  const byDay = {};
  for(const it of state.calItems){ (byDay[it.on_date] = byDay[it.on_date] || []).push(it); }
  const today = todayIso();
  let cells = DOW.map((d) => '<div class="dow">' + d + '</div>').join('');
  for(let i = 0; i < 42; i += 1){
    const iso = addDays(gridFrom, i);
    const inMonth = Number(iso.split('-')[1]) === m && Number(iso.split('-')[0]) === y;
    // Six rows always fit a month, but the last row is often entirely next
    // month — drop it rather than show a blank stripe.
    if(i >= 35 && !inMonth && !(byDay[iso] || []).length) continue;
    cells += '<div class="day' + (inMonth ? '' : ' out') + (iso === today ? ' today' : '') + '">'
      + '<span class="dnum">' + Number(iso.split('-')[2]) + '</span>'
      + (byDay[iso] || []).map(calChip).join('')
      + '</div>';
  }
  return '<div class="calgrid">' + cells + '</div>';
}

// Overdue first, then today, then the next fortnight. Done items are left out:
// this is the list of what is left to do.
function dueList(){
  const today = todayIso();
  const horizon = addDays(today, 14);
  const open = state.calItems.filter((it) => it.kind === 'followup' && !it.done && it.on_date <= horizon);
  open.sort((a, b) => (a.on_date < b.on_date ? -1 : a.on_date > b.on_date ? 1 : String(a.at_time || '99').localeCompare(String(b.at_time || '99'))));
  if(!open.length){
    return '<p class="muted" id="dueEmpty">Nothing due in the next two weeks. Add a follow-up and it will show up here, and in your 7am email on the day.</p>';
  }
  return '<div class="duelist">' + open.map((it) => {
    const late = it.on_date < today;
    const gap = daysBetween(it.on_date, today);
    const when = late
      ? prettyDay(it.on_date) + ' · ' + gap + ' day' + (gap === 1 ? '' : 's') + ' ago'
      : it.on_date === today
        ? 'Today' + (it.at_time ? ' · ' + clockOf(it.at_time) : '')
        : prettyDay(it.on_date) + (it.at_time ? ' · ' + clockOf(it.at_time) : '');
    return '<div class="due' + (late ? ' overdue' : '') + '" data-due="' + it.followup_id + '">'
      + '<span class="when">' + esc(when) + '</span>'
      + '<span class="what"><b>' + esc(it.title) + '</b>'
      + (it.detail ? '<p>' + esc(it.detail) + '</p>' : '') + '</span>'
      + '<button type="button" class="btn small secondary" data-tick="' + it.followup_id + '">Done</button>'
      + '<button type="button" class="btn small secondary" data-fu="' + it.followup_id + '">Edit</button>'
      + '</div>';
  }).join('') + '</div>';
}

async function renderCalendar(){
  const { gridFrom } = await loadCalendar();
  const [y, m] = calMonthStart().split('-').map(Number);
  const mine = state.calItems.filter((it) => it.kind === 'followup' && !it.done).length;
  $('tab-calendar').innerHTML =
    '<div class="calhead">'
    + '<h3>' + MONTHS[m - 1] + ' ' + y + '</h3>'
    + '<button type="button" class="btn small secondary" id="calPrev">&larr;</button>'
    + '<button type="button" class="btn small secondary" id="calToday">This month</button>'
    + '<button type="button" class="btn small secondary" id="calNext">&rarr;</button>'
    + '<button type="button" class="btn small" id="calAdd">Add a follow-up</button>'
    + '</div>'
    + calGrid(gridFrom)
    + '<h3 style="margin:22px 0 2px;">What is left to do</h3>'
    + '<p class="muted">Your own follow-ups. A digest of whatever is due goes to '
    + esc(state.me && state.me.email ? state.me.email : 'your email') + ' at 7am on the day.</p>'
    + dueList()
    + '<p class="muted" style="margin-top:18px;">The grey and green marks on the month are things that already happened — a lead signing up, a dashboard being built, a dealer going live. '
    + (state.isRep ? 'Yours only.' : 'Every company’s.') + ' Follow-ups are only ever your own.</p>';

  $('calPrev').addEventListener('click', () => { shiftMonth(-1); renderCalendar().catch((e) => flash(e.message)); });
  $('calNext').addEventListener('click', () => { shiftMonth(1); renderCalendar().catch((e) => flash(e.message)); });
  $('calToday').addEventListener('click', () => { state.calMonth = null; renderCalendar().catch((e) => flash(e.message)); });
  $('calAdd').addEventListener('click', () => followupDialog(null));
  $('tab-calendar').querySelectorAll('[data-fu]').forEach((b) => b.addEventListener('click', () => followupDialog(b.dataset.fu)));
  $('tab-calendar').querySelectorAll('[data-tick]').forEach((b) => b.addEventListener('click', () => tickFollowup(b.dataset.tick, b)));
}

async function tickFollowup(id, btn){

/* ---------- the wording a dealer's own customers read ---------- */
// Same nine lines, in the same order, as api/src/lib/tenantCopy.js — keep the
// two in step. A business never sees these labels; a rep does, sitting across
// from the owner, so each one says where the sentence turns up rather than
// what the key is called. `generic` is what runs if the box is left empty: it
// is deliberately trade-neutral, so a roofer whose rep typed nothing still
// never reads "buy a shed from us".
const COPY_FIELDS = [
  { key:'offerHow', stage:'Their invite email, and their share page', label:'How the program works, in a sentence or two', multiline:true, max:600,
    where:'The main offer line — the first thing a past customer reads. Wrap words in **stars** to bold them in the email.',
    generic:"Here's how it works: make a purchase with us and you'll receive your own referral link to share. When a friend buys through that link, you each receive a **{reward} Amazon E-Gift Card**." },
  { key:'shareTitle', stage:'Their invite email, and their share page', label:'Title when a customer shares their link', max:200,
    where:'The heading on a phone’s share sheet.',
    generic:'Get {reward} when you make a purchase from {name}' },
  { key:'shareText', stage:'Their invite email, and their share page', label:'Message the share sheet fills in', multiline:true, max:400,
    where:'What their customer sends a friend, before they edit it.',
    generic:'I referred you — make your purchase through my link and we both get {reward}.' },
  { key:'friendAction', stage:'The page the referred friend lands on', label:'What the friend has to do', max:120,
    where:'Finishes “When you …, you and your friend each get a card.” A few words.',
    generic:'make your purchase' },
  { key:'afterPurchase', stage:'The page the referred friend lands on', label:'The same thing, past tense', max:120,
    where:'Finishes “Once you have …” on the screen after they send the form.',
    generic:'made your purchase' },
  { key:'inquiryNoun', stage:'The page the referred friend lands on', label:'What their form submission is called', max:120,
    where:'Used on the privacy page, e.g. “we keep your roofing inquiry”.',
    generic:'inquiry' },
  { key:'eligibility', stage:'Their terms page', label:'Who can take part', max:300,
    where:'Finishes “Anyone who has … may refer a friend.”',
    generic:'have made a purchase with us' },
  { key:'qualifyingEvent', stage:'Their terms page', label:'What earns the reward', max:300,
    where:'Finishes “A reward is earned when the referred friend …”',
    generic:'places and completes a qualifying order' },
  { key:'rewardCondition', stage:'Their terms page', label:'What they confirm before a card goes out', multiline:true, max:600,
    where:'Finishes “Cards are sent once …” — this is what keeps them from paying on a cancelled order.',
    generic:'confirms the referred order has actually been placed and a qualifying deposit received. Cancelled, refunded, or unfulfilled orders do not qualify for a reward.' },
];

// Every box carries its generic wording as the placeholder, so an empty box
// shows exactly what will run instead of looking like something is missing.
function copyFieldsHtml(values){
  const v = values || {};
  let stage = null;
  return COPY_FIELDS.map((f) => {
    const head = f.stage === stage ? '' : '<p class="stagehead">' + esc(f.stage) + '</p>';
    stage = f.stage;
    const val = esc(v[f.key] || '');
    const common = 'name="copy_' + f.key + '" maxlength="' + f.max + '" placeholder="' + esc(f.generic) + '"';
    return head + '<label>' + esc(f.label) + '</label>' +
      (f.multiline
        ? '<textarea ' + common + ' rows="3">' + val + '</textarea>'
        : '<input ' + common + ' value="' + val + '">') +
      '<p class="hint">' + esc(f.where) + '</p>';
  }).join('');
}

// Pulls the boxes back out. A box left empty is simply absent, which is what
// tells the API to use the generic wording for that line.
function readCopyFields(form){
  const out = {};
  COPY_FIELDS.forEach((f) => {
    const el = form.querySelector('[name="copy_' + f.key + '"]');
    const t = el && el.value ? el.value.trim() : '';
    if(t) out[f.key] = t;
  });
  return out;
}

function copyCount(copy){
  return copy ? COPY_FIELDS.filter((f) => copy[f.key]).length : 0;
}

// The summary line on the add-a-lead form and the lead row: says how much of
// it is their own words rather than showing nine fields' worth of text.
function wordingSummary(copy){
  const n = copyCount(copy);
  if(!n) return 'nothing written yet — generic wording will be used';
  return n + ' of ' + COPY_FIELDS.length + ' in their own words';
}

/* ---------- finding something in a long list ---------- */
// Filters the rows already on the page rather than asking the API again:
// instant, keeps the cursor where it is, and every list here is already
// loaded in full. Each row carries a data-search attribute built from the
// fields worth matching, rather than matching the row's text — a Companies
// row contains a dropdown listing every rep, so matching its text would make
// a rep's name match every company.
const SEARCH = { leads:'', dealers:'', reps:'' };

function searchBox(key, placeholder){
  return '<div class="searchrow">' +
    '<input type="search" class="searchbox" data-search-for="' + key + '" placeholder="' + esc(placeholder) + '" ' +
      'value="' + esc(SEARCH[key] || '') + '" autocomplete="off" spellcheck="false">' +
    '<span class="muted" data-search-count="' + key + '"></span></div>';
}

function searchable(parts){
  return esc(parts.filter(Boolean).join(' ').toLowerCase());
}

// Every word has to appear somewhere in the row, in any order — so "silver
// roof" finds Silver Run Home Improvements (roofing) without needing the
// words adjacent or in the right order.
function applySearch(tabId, key){
  const q = (SEARCH[key] || '').trim().toLowerCase();
  const words = q ? q.split(/\s+/) : [];
  const rows = $(tabId).querySelectorAll('tbody tr[data-search]');
  let shown = 0;
  rows.forEach((tr) => {
    const hay = tr.getAttribute('data-search') || '';
    const hit = words.every((w) => hay.includes(w));
    tr.hidden = !hit;
    if(hit) shown += 1;
  });
  const count = $(tabId).querySelector('[data-search-count="' + key + '"]');
  if(count){
    count.textContent = !q ? ''
      : (shown ? shown + ' of ' + rows.length : 'nothing matches “' + q + '”');
  }
}

// Take whatever is physically in the box right now as the query, immediately
// before a redraw rebuilds it from SEARCH[key]. Called there and nowhere else:
// a render builds its HTML in one go from that variable, and a keystroke
// landing while the fetch was still in flight updates the box but only reaches
// SEARCH through an input handler that the box may not have yet. The box is
// what the person can see, so the box wins.
function captureSearch(tabId, key){
  const el = $(tabId);
  const box = el && el.querySelector('[data-search-for="' + key + '"]');
  if(box) SEARCH[key] = box.value;
}
function wireSearch(tabId, key){
  const box = $(tabId).querySelector('[data-search-for="' + key + '"]');
  if(!box) return;
  box.addEventListener('input', () => { SEARCH[key] = box.value; applySearch(tabId, key); });
  // Typing filters rows already on the page and never redraws the tab, so the
  // cursor is never taken away mid-search. A redraw from something else —
  // adding a lead, saving an assignment — rebuilds the box with the query
  // still in it, and deliberately does not grab focus back: someone may have
  // been typing in the form above it.
  applySearch(tabId, key);
}

function todayYmd(){ return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
function formData(form){ const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }

async function submitLead(form, confirmDuplicate){
  const d = formData(form);
  const body = { company_name: d.company_name, contact_name: d.contact_name, phone: d.phone, email: d.email, website: d.website, notes: d.notes, found_on: d.found_on || undefined, brought_in_by_rep_id: d.brought_in_by_rep_id || null };
  const copy = readCopyFields(form);
  if(Object.keys(copy).length) body.copy = copy;
  if(confirmDuplicate) body.confirm_duplicate = true;
  try{
    await post('/rep-leads', body);
    form.reset();
    flash('Lead added.', true);
    await renderLeads();
  }catch(err){
    if(err.code === 'possible_duplicate'){
      const canAdd = err.body.can_add_anyway !== false;
      // A match the server would not show us belongs to another rep: we are
      // told the company is taken and nothing else, so say exactly that.
      const m = (err.body.matches || []).map((x) => x.visible === false
        ? '<li><b>' + esc(x.company_name) + '</b> — already being worked</li>'
        : '<li><b>' + esc(x.company_name) + '</b> ' + esc([x.contact_name, x.phone, x.email].filter(Boolean).join(' · ')) + ' — found ' + esc(plainDate(x.found_on)) + (x.brought_in_by_rep_id ? ' by ' + esc(repName(x.brought_in_by_rep_id)) : '') + ' (' + esc(x.status || '') + ')</li>').join('');
      $('dupBox').innerHTML = '<div class="notice"><b>' + esc(err.message) + '</b><ul>' + m + '</ul>' +
        (canAdd
          ? 'If it is a different company, add it anyway. <div class="actions"><button class="btn small" id="addAnyway" type="button">Add anyway</button></div>'
          : '') + '</div>';
      if(canAdd) $('addAnyway').addEventListener('click', () => submitLead(form, true));
    } else flash(err.message);
  }
}

async function drawFiles(leadId){
  let files = [];
  try{ files = (await api('/rep-leads/' + leadId + '/files')).files; }catch(err){ $('fileBody').innerHTML = '<div class="notice">' + esc(err.message) + '</div>'; return; }
  const logo = files.find((f) => f.kind === 'logo');
  $('fileBody').innerHTML =
    '<p class="muted">Drop their logo here, or anything else that shows their colours — a brand sheet, a photo of their sign, a screenshot. The logo is the one that ends up on their pages.</p>' +
    '<div id="drop" style="border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#FBF9F5">' +
      '<b>Drop files here</b><div class="muted">or click to choose · PNG, JPG, WEBP, GIF, SVG or PDF, up to 5MB</div>' +
      '<input type="file" id="filePick" multiple accept="' + FILE_TYPES + '" style="display:none">' +
    '</div>' +
    '<div id="upMsg" class="msg"></div>' +
    (files.length
      ? '<div class="tablewrap" style="margin-top:14px"><table style="min-width:0"><tbody>' +
        files.map((f) =>
          '<tr><td style="width:52px">' + (/^image\/(png|jpe?g|webp|gif|svg)/.test(f.content_type)
            ? '<img src="' + esc(f.public_url) + '" alt="" style="width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px">'
            : '<span class="pill">PDF</span>') + '</td>' +
          '<td><b>' + esc(f.filename) + '</b><div class="muted">' + Math.max(1, Math.round(f.size_bytes / 1024)) + ' KB' + (f.kind === 'logo' ? ' · their logo' : '') + '</div></td>' +
          '<td class="num">' + (f.kind === 'logo' ? '' : '<button class="btn small secondary" data-mklogo="' + f.id + '">Use as logo</button> ') +
            '<button class="btn small danger" data-delfile="' + f.id + '">Remove</button></td></tr>'
        ).join('') + '</tbody></table></div>'
      : '<p class="muted" style="margin-top:12px">Nothing yet.</p>') +
    '<div class="actions"><button class="btn secondary" id="cancelDlg" type="button">Done</button></div>';

  void logo;
  $('cancelDlg').addEventListener('click', () => { closeDialog(); renderLeads().catch(() => {}); });
  const drop = $('drop'), pick = $('filePick');
  drop.addEventListener('click', () => pick.click());
  pick.addEventListener('change', () => uploadFiles(leadId, [...pick.files]));
  ['dragenter','dragover'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.style.borderColor = 'var(--secondary)'; }));
  ['dragleave','drop'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.style.borderColor = 'var(--line)'; }));
  drop.addEventListener('drop', (ev) => uploadFiles(leadId, [...(ev.dataTransfer ? ev.dataTransfer.files : [])]));
  $('fileBody').querySelectorAll('[data-delfile]').forEach((b) => b.addEventListener('click', async () => {
    try{ await api('/rep-lead-files/' + b.dataset.delfile, { method:'DELETE' }); await drawFiles(leadId); }
    catch(err){ upMsg(err.message, false); }
  }));
  $('fileBody').querySelectorAll('[data-mklogo]').forEach((b) => b.addEventListener('click', async () => {
    // One logo per lead: re-upload under kind=logo is the simplest honest way
    // to change which one it is, so this just tells them to drop it again.
    upMsg('Remove the current logo first, then drop this one in — the first image you add becomes the logo.', false);
    void b;
  }));
}

function upMsg(text, ok){ const el = $('upMsg'); if(!el) return; el.textContent = text; el.className = 'msg show ' + (ok ? 'okmsg' : 'err'); }

async function uploadFiles(leadId, files){
  if(!files.length) return;
  const existing = (await api('/rep-leads/' + leadId + '/files').catch(() => ({ files: [] }))).files || [];
  let haveLogo = existing.some((f) => f.kind === 'logo');
  for(const file of files){
    if(file.size > 5 * 1024 * 1024){ upMsg(file.name + ' is bigger than 5MB.', false); continue; }
    upMsg('Uploading ' + file.name + '…', true);
    // The first image on a lead is its logo, because that is what a rep
    // almost always drops first and asking would be a question with one
    // sensible answer.
    const isImage = /^image\//.test(file.type);
    const kind = (!haveLogo && isImage) ? 'logo' : 'other';
    try{
      const s = getSession();
      const res = await fetch(API_BASE + '/rep-leads/' + leadId + '/files?kind=' + kind + '&filename=' + encodeURIComponent(file.name), {
        method:'POST',
        headers:{ 'Content-Type': file.type || 'application/octet-stream', ...(s ? { Authorization: 'Bearer ' + s.access_token } : {}) },
        body: file,
      });
      const body = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(body.error || ('Upload failed (' + res.status + ')'));
      if(kind === 'logo') haveLogo = true;
    }catch(err){ upMsg(file.name + ': ' + err.message, false); }
  }
  upMsg('Uploaded.', true);
  await drawFiles(leadId);
}

/* ---------- charts ---------- */
// Drawn by hand as SVG rather than pulled from a library: these are a dozen
// bars and a ring, the page already has no build step and no dependencies, and
// a chart that inherits the page's own colours and prints with it is worth
// more here than one that arrives with its own opinions.

// A "nice" top to the axis, so the gridline labels are round numbers a person
// reads at a glance rather than 1,347.
function niceMax(value){
  if(!(value > 0)) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(value)));
  const n = value / pow;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * pow;
}

// Grouped bars: one group per month, one bar per series.
// series: [{ key, label, color }], rows: [{ label, [key]: number }]
function barChart(rows, series, { money = false, height = 190 } = {}){
  const W = 760, H = height, padL = 52, padR = 10, padT = 12, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = niceMax(Math.max(0, ...rows.flatMap((r) => series.map((s) => Number(r[s.key]) || 0))));
  const groupW = plotW / rows.length;
  const barW = Math.max(3, (groupW - 6) / series.length);
  const y = (v) => padT + plotH - (Math.max(0, v) / max) * plotH;
  const fmt = (v) => money ? dollars(v) : String(v);

  let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Monthly chart">';
  // Four gridlines, labelled, because a bar you cannot measure is decoration.
  for(let i = 0; i <= 4; i++){
    const v = (max / 4) * i, gy = y(v);
    svg += '<line class="axis" x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '"></line>';
    svg += '<text x="' + (padL - 6) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end">' + esc(money ? dollars(v).replace(/\.00$/, '') : Math.round(v)) + '</text>';
  }
  rows.forEach((row, i) => {
    const gx = padL + i * groupW;
    series.forEach((sdef, j) => {
      const v = Number(row[sdef.key]) || 0;
      const bx = gx + 3 + j * barW;
      const by = y(v), bh = Math.max(v > 0 ? 1.5 : 0, padT + plotH - by);
      svg += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + (barW - 1.5).toFixed(1) +
             '" height="' + bh.toFixed(1) + '" rx="2" fill="' + sdef.color + '"><title>' +
             esc(row.label + ' · ' + sdef.label + ': ' + fmt(v)) + '</title></rect>';
    });
    svg += '<text x="' + (gx + groupW / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(row.label) + '</text>';
  });
  svg += '</svg>';
  const legend = '<div class="legend">' + series.map((sdef) =>
    '<span><i style="background:' + sdef.color + '"></i>' + esc(sdef.label) + '</span>').join('') + '</div>';
  return '<div class="chartwrap">' + svg + '</div>' + legend;
}

// A ring rather than a pie: the hole is where the number that matters goes.
function donut(slices, centreTop, centreSub){
  const size = 150, r = 58, stroke = 22, c = size / 2;
  const total = slices.reduce((n, s) => n + s.value, 0);
  let angle = -Math.PI / 2;
  let paths = '';
  if(total > 0){
    slices.forEach((s) => {
      if(s.value <= 0) return;
      const sweep = (s.value / total) * Math.PI * 2;
      const end = angle + sweep;
      // A slice that is the whole ring cannot be drawn as an arc; draw a circle.
      if(s.value === total){
        paths += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="' + stroke + '"><title>' + esc(s.label + ': ' + s.value) + '</title></circle>';
      }else{
        const x1 = c + r * Math.cos(angle), y1 = c + r * Math.sin(angle);
        const x2 = c + r * Math.cos(end), y2 = c + r * Math.sin(end);
        paths += '<path d="M ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' +
                 (sweep > Math.PI ? 1 : 0) + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + '" fill="none" stroke="' +
                 s.color + '" stroke-width="' + stroke + '" stroke-linecap="butt"><title>' + esc(s.label + ': ' + s.value) + '</title></path>';
      }
      angle = end;
    });
  }else{
    paths = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"></circle>';
  }
  return '<svg class="chart" style="min-width:0;max-width:' + size + 'px;margin:0 auto" viewBox="0 0 ' + size + ' ' + size + '" role="img">' +
    paths +
    '<text x="' + c + '" y="' + (c - 2) + '" text-anchor="middle" style="font-family:Fraunces,serif;font-size:21px;fill:var(--primary)">' + esc(centreTop) + '</text>' +
    '<text x="' + c + '" y="' + (c + 15) + '" text-anchor="middle">' + esc(centreSub) + '</text></svg>' +
    '<div class="legend" style="justify-content:center">' + slices.map((s) =>
      '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + ' ' + s.value + '</span>').join('') + '</div>';
}

// What the dealer's own page header will look like, drawn from whatever is in
// the boxes right now. Cheaper than imagining it, and it catches a logo that
// disappears on a dark bar before the dealer sees it.
function drawPreview(){
  const get = (k) => ($('dlg').querySelector('[data-hex="' + k + '"]') || {}).value || '#000000';
  const p = $('previewBar');
  if(!p) return;
  p.style.background = get('primaryColor');
  p.style.color = '#fff';
  const chip = $('previewAccent');
  if(chip){ chip.style.background = get('accentColor'); }
  const body = $('previewBody');
  if(body){ body.style.background = get('bg'); }
}

      await renderBuilds();
    }catch(err){
      flash(err.message);
      btn.disabled = false; btn.textContent = 'Build dashboard';
    }
  });
}

/* ---------- a rep's year ---------- */
// Opens for the rep themselves and for Joseph, from the same place, showing
// the same numbers. Nothing here is modelled: every figure is a count or a sum

async function repReport(repId, year){
  openDialog('<h3>Loading…</h3>', { wide: true });

/* ---------- removing a company or a rep for good ---------- */
// The dialog's job is to make the consequence impossible to misread before
// the button works: what disappears, what stays, and that the card stops.
// The name has to be typed exactly, so this cannot happen on a misclick.
function confirmDeleteDialog({ title, name, lead, goes, stays, button, onConfirm }){
  openDialog(
    '<h3>' + esc(title) + '</h3>' +
    '<p>' + lead + '</p>' +
    '<div class="notice"><b>Gone for good</b><ul style="margin:6px 0 0;padding-left:18px">' +
      goes.map((x) => '<li>' + x + '</li>').join('') + '</ul></div>' +
    '<p class="muted"><b>Kept:</b> ' + stays + '</p>' +
    '<form id="delForm">' +
      '<label>Type <b>' + esc(name) + '</b> to confirm</label>' +
      '<input name="confirm_name" autocomplete="off" spellcheck="false" placeholder="' + esc(name) + '">' +
      '<label>Why? (optional, kept with the record)</label>' +
      '<input name="reason" maxlength="500">' +
      '<div class="actions">' +
        '<button type="button" class="btn secondary" id="cancelDlg">Keep it</button>' +
        '<button class="btn danger" type="submit" id="doDelete" disabled>' + esc(button) + '</button>' +
      '</div></form>'
  );
  const form = $('delForm');
  const typed = form.querySelector('[name=confirm_name]');
  const go = $('doDelete');
  // Exact, trimmed only at the ends — a name is not a password, but it is not
  // a yes/no either.
  typed.addEventListener('input', () => { go.disabled = typed.value.trim() !== name; });
  typed.focus();
  $('cancelDlg').addEventListener('click', closeDialog);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(typed.value.trim() !== name) return;
    go.disabled = true; go.textContent = 'Removing…';
    try{
      await onConfirm({ confirm_name: typed.value.trim(), reason: form.querySelector('[name=reason]').value.trim() || undefined });
    }catch(err){
      flash(err.message);
      go.disabled = false; go.textContent = button;
    }
  });
}

async function deleteCompanyDialog(tenantId){
  const c = state.dealers.find((x) => x.tenant_id === tenantId);
  if(!c) return flash('That company is gone.');
  if(c.billing_exempt) return flash('That is one of your own companies. It cannot be removed here.');
  if(c.closed_at) return flash(c.name + ' is already closed.');

  // What happens depends on whether they ever traded, so the dialog says which
  // it will be before the button is pressed rather than reporting it after.
  // The database decides for real, under the row lock; this only has to match
  // what the person is about to see.
  let traded = Boolean(c.activated);
  try{
    const r = await api('/reports/tenant/' + tenantId);
    traded = traded || Boolean(r.totals.paid_cents);
  }catch(err){ /* fall back to whether they ever paid the $500 */ }

  confirmDeleteDialog({
    title: (traded ? 'Close ' : 'Delete ') + c.name,
    name: c.name,
    lead: traded
      ? 'They traded with you, so their payments have to stay in your books. Their card comes off file first \u2014 no renewal, no 30% fee, nothing more can be charged \u2014 and they move out of this list into <b>closed</b>.'
      : 'They never traded: no payment taken, nothing earned from them. There is nothing to keep, so this removes them completely \u2014 row and all.',
    goes: traded
      ? [
        'Every customer and referral name, email and phone number \u2014 wiped, though the counts stay so their year still reads',
        'Their logins \u2014 nobody there can sign in again',
        'Their saved card, renewal date and sending address',
      ]
      : [
        'The company, and every trace of it',
        'Every customer, referral, link and login',
        'Their branding, wording and sending address',
      ],
    stays: traded
      ? 'Their name and everything they paid you stay in your books, so Finances and past years still add up. Their report still opens, with the numbers but no names. The lead that brought them in keeps your rep\u2019s credit.'
      : 'Nothing \u2014 there is nothing of theirs in your books. The lead that brought them in stays, so your rep keeps credit for the work.',
    button: traded ? 'Close this company' : 'Delete this company',
    onConfirm: async (body) => {
      const out = await api('/rep-dealers/' + tenantId, { method:'DELETE', body: JSON.stringify(body) });
      closeDialog();
      flash(out.outcome === 'deleted'
        ? out.name + ' is deleted \u2014 nothing of theirs is left.'
        : out.name + ' is closed. ' + (out.card_detached ? 'Their card is off file. ' : 'There was no card on file. ') +
          out.customers_affected + ' customer' + (out.customers_affected === 1 ? '' : 's') + ' anonymised; their numbers still open from the closed list.', true);
      state.closedCount = null; // one more, or one fewer company — recount
      await renderDealers();
    },
  });
}

function deleteRepDialog(repId){
  const r = state.reps.find((x) => x.id === repId);
  if(!r) return flash('That rep is gone.');
  if(r.closed_at) return flash(r.name + ' has already been removed.');
  const owed = r.owed_cents || 0;
  if(owed !== 0){
    return flash(owed > 0
      ? 'You still owe ' + r.name + ' ' + dollars(owed) + '. Pay them or reverse the earnings first, then remove them.'
      : r.name + ' has been overpaid by ' + dollars(Math.abs(owed)) + '. Settle that first, then remove them.');
  }
  // has_history comes from the API, which computes it with the same three
  // tests remove_rep() makes. It is NOT guessed from the money or the dealer
  // counts: those count current assignments, which disappear when a company is
  // deleted, while the rep's leads deliberately stay. Guessing that way told
  // Joseph it would delete Ben outright — "the leads stay in the pipeline, with
  // nobody on them" — when the database would have closed him and kept his
  // name on those leads, which is the only thing a won lead permits.
  const keep = r.has_history !== false;
  confirmDeleteDialog({
    title: (keep ? 'Remove ' : 'Delete ') + r.name,
    name: r.name,
    lead: keep
      ? 'Their balance is settled, so nothing is owed either way. Their name has to stay on the leads they closed and on anything they earned, so the record keeps adding up.'
      : 'Nothing anywhere points at them \u2014 no money, no leads. This removes them completely.',
    goes: [
      'Their login \u2014 they cannot sign in again',
      'Their email, phone and notes',
      'Their place on every dealer, so nothing from here on earns them anything',
    ].concat(keep ? [] : ['Their name, and the rep record itself']),
    stays: keep
      ? 'Their name stays on the leads they brought in or closed, and on what they earned and what you paid them, so your statements and your pipeline both still read correctly. They stop counting as active.'
      : 'Nothing \u2014 there is nothing of theirs to keep.',
    button: keep ? 'Remove this rep' : 'Delete this rep',
    onConfirm: async (body) => {
      const out = await api('/reps/' + repId, { method:'DELETE', body: JSON.stringify(body) });
      closeDialog();
      flash(out.name + (out.outcome === 'deleted' ? ' is deleted \u2014 nothing of theirs is left.' : ' is removed. What they earned stays in your money history.') +
        (out.dealers_released ? ' Taken off ' + out.dealers_released + ' dealer' + (out.dealers_released === 1 ? '' : 's') + '.' : ''), true);
      await loadReps();
      await renderReps();
    },
  });
}

  $('coYear').addEventListener('change', (e) => renderCompany(e.target.value).catch((err) => flash(err.message)));
  $('printCo').addEventListener('click', () => window.print());
  $('addExpense').addEventListener('click', () => expenseDialog(null));
  $('tab-company').querySelectorAll('[data-editexp]').forEach((b) => b.addEventListener('click', () => expenseDialog(b.dataset.editexp)));
  $('tab-company').querySelectorAll('[data-delexp]').forEach((b) => b.addEventListener('click', async () => {
    const e = d.expenses.find((x) => x.id === b.dataset.delexp);
    if(!window.confirm('Remove "' + e.name + '" from the cost list? Past months stop counting it.')) return;
    try{ await api('/reports/expenses/' + b.dataset.delexp, { method:'DELETE' }); await renderCompany(d.year); }
    catch(err){ flash(err.message); }
  }));
  $('feeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = formData(e.target);
    try{
      await put('/reports/card-fee', { card_fee_bps: Math.round(Number(f.pct) * 100), card_fee_fixed_cents: Math.round(Number(f.fixed) * 100) });
      flash('Rate saved.', true); await renderCompany(d.year);
    }catch(err){ flash(err.message); }
  });
}

function expenseDialog(id){
  const e = id ? state.company.expenses.find((x) => x.id === id)
               : { name:'', category:'other', amount_cents:0, recurrence:'monthly', started_on: todayYmd(), ended_on:null, notes:'' };
  const cats = ['hosting','email','payments','software','rewards','people','other'];
  const recs = [['monthly','Every month'],['yearly','Once a year'],['once','One-off']];
  openDialog(
    '<h3>' + (id ? 'Edit ' + esc(e.name) : 'Add a cost') + '</h3>' +
    '<form id="expForm"><div class="row">' +
      '<div><label>What is it</label><input name="name" required maxlength="120" value="' + esc(e.name) + '"></div>' +
      '<div><label>Amount ($)</label><input name="amount" type="number" min="0" step="0.01" value="' + (e.amount_cents / 100) + '"></div></div>' +
    '<div class="row"><div><label>Kind</label><select name="category">' +
        cats.map((c) => '<option value="' + c + '"' + (c === e.category ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
      '<div><label>How often</label><select name="recurrence">' +
        recs.map(([v, l]) => '<option value="' + v + '"' + (v === e.recurrence ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div></div>' +
    '<div class="row"><div><label>Started</label><input name="started_on" type="date" value="' + esc(String(e.started_on).slice(0,10)) + '"></div>' +
      '<div><label>Ended <span class="muted">(leave blank if ongoing)</span></label><input name="ended_on" type="date" value="' + esc(e.ended_on ? String(e.ended_on).slice(0,10) : '') + '"></div></div>' +
    '<label>Note</label><input name="notes" maxlength="500" value="' + esc(e.notes || '') + '">' +
    '<div class="actions"><button type="button" class="btn secondary" id="cancelDlg">Cancel</button><button class="btn" type="submit">Save</button></div></form>'
  );
  $('cancelDlg').addEventListener('click', closeDialog);
  $('expForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = formData(ev.target);
    const body = {
      name: f.name, category: f.category, recurrence: f.recurrence,
      amount_cents: Math.round(Number(f.amount || 0) * 100),
      started_on: f.started_on || undefined,
      ended_on: f.ended_on || null,
      notes: f.notes || null,
    };
    try{
      if(id) await patch('/reports/expenses/' + id, body); else await post('/reports/expenses', body);
      closeDialog(); flash('Saved.', true); await renderCompany(state.company.year);
    }catch(err){ flash(err.message); closeDialog(); }
  });
}

/* ---------- Money (admin only) ---------- */
async function renderMoney(){
  const q = state.month ? '?month=' + state.month : '';
  const [ov, settings] = await Promise.all([api('/rep-money/overview' + q), api('/rep-settings')]);
  state.money = ov; state.month = ov.month; state.settings = settings;
  await loadReps();
  const t = ov.totals;
  $('tab-money').innerHTML =
    '<div class="head"><h2>Money</h2><div class="inline"><label style="margin:0">Month</label><input type="month" id="monthPick" value="' + ov.month + '" style="width:auto"></div></div>' +
    '<div class="cards"><div class="stat"><b>' + dollars(t.owed_cents) + '</b><span>You owe reps right now</span></div>' +
    '<div class="stat"><b>' + dollars(t.earned_cents) + '</b><span>Earned in ' + esc(monthLabel(ov.month)) + '</span></div>' +
    '<div class="stat"><b>' + dollars(t.paid_cents) + '</b><span>Paid in ' + esc(monthLabel(ov.month)) + '</span></div></div>' +
    '<div class="tablewrap"><table><thead><tr><th>Rep</th><th class="num">Sign-up bonuses</th><th class="num">Referral royalties</th><th class="num">Reversals</th><th class="num">Earned</th><th class="num">Paid</th><th class="num">You owe</th><th></th></tr></thead><tbody>' +
    (ov.reps.map((r) =>
      '<tr><td><b>' + esc(r.name) + '</b> ' + (r.active ? '' : '<span class="pill off">inactive</span>') + '</td>' +
      '<td class="num">' + dollarCell(r.activation_cents) + '</td><td class="num">' + dollarCell(r.royalty_cents) + '</td><td class="num">' + dollarCell(r.reversal_cents) + '</td>' +
      '<td class="num"><b>' + dollarCell(r.earned_cents) + '</b></td><td class="num">' + dollarCell(r.paid_cents) + '</td><td class="num"><b>' + dollarCell(r.owed_cents) + '</b></td>' +
      '<td class="num"><button class="btn small secondary" data-stmt="' + r.id + '">Statement</button> <button class="btn small" data-pay="' + r.id + '">Record payment</button></td></tr>'
    ).join('') || '<tr><td colspan="8" class="muted" style="padding:18px">No reps yet.</td></tr>') + '</tbody></table></div>' +
    '<details class="card" style="margin-top:18px"><summary>Pay rates</summary><form id="rateForm">' +
      '<h3 style="font-size:15px;margin:6px 0 2px">The closer</h3>' +
      '<div class="row"><div><label>Sign-up bonus ($)</label><input name="activation_cents" type="number" min="0" step="0.01" value="' + (settings.activation_cents / 100) + '"></div>' +
      '<div><label>Per referral ($)</label><input name="referral_cents" type="number" min="0" step="0.01" value="' + (settings.referral_cents / 100) + '"></div>' +
      '<div><label>Per referral past the threshold ($)</label><input name="referral_cents_after_threshold" type="number" min="0" step="0.01" value="' + (settings.referral_cents_after_threshold / 100) + '"></div></div>' +
      '<h3 style="font-size:15px;margin:16px 0 2px">The onboarder</h3>' +
      '<p class="muted" style="margin:0 0 6px">Zero, so the closer earns everything. Put numbers in to start paying a second person.</p>' +
      '<div class="row"><div><label>Sign-up bonus ($)</label><input name="onboarder_activation_cents" type="number" min="0" step="0.01" value="' + (settings.onboarder_activation_cents / 100) + '"></div>' +
      '<div><label>Per referral ($)</label><input name="onboarder_referral_cents" type="number" min="0" step="0.01" value="' + (settings.onboarder_referral_cents / 100) + '"></div>' +
      '<div><label>Per referral past the threshold ($)</label><input name="onboarder_referral_cents_after_threshold" type="number" min="0" step="0.01" value="' + (settings.onboarder_referral_cents_after_threshold / 100) + '"></div></div>' +
      '<h3 style="font-size:15px;margin:16px 0 2px">Both</h3>' +
      '<div class="row"><div><label>Threshold: a rep\'s company number</label><input name="threshold_companies" type="number" min="1" step="1" value="' + settings.threshold_companies + '"></div>' +
      '<div><label>Full rate at a gift card of ($)</label><input name="full_rate_card_cents" type="number" min="0.01" step="0.01" value="' + (settings.full_rate_card_cents / 100) + '"></div></div>' +
      '<p class="muted">The per-referral amount is paid in full at a gift card of this size or more, and scaled down in proportion for smaller cards. What is already earned never changes — but raising a rate from zero pays that side on every payment it has not earned on yet, including ones that cleared earlier.</p>' +
      '<div class="actions"><button class="btn" type="submit">Save rates</button></div></form></details>';
  $('monthPick').addEventListener('change', (e) => { if(e.target.value){ state.month = e.target.value; renderMoney().catch((err) => flash(err.message)); } });
  $('tab-money').querySelectorAll('[data-stmt]').forEach((b) => b.addEventListener('click', () => statementDialog(b.dataset.stmt)));
  $('tab-money').querySelectorAll('[data-pay]').forEach((b) => b.addEventListener('click', () => payDialog(b.dataset.pay, 0)));
  $('rateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = formData(e.target);
    const cents = (v) => Math.round(Number(v) * 100);
    try{
      await put('/rep-settings', {
        activation_cents: cents(d.activation_cents),
        referral_cents: cents(d.referral_cents),
        referral_cents_after_threshold: cents(d.referral_cents_after_threshold),
        onboarder_activation_cents: cents(d.onboarder_activation_cents),
        onboarder_referral_cents: cents(d.onboarder_referral_cents),
        onboarder_referral_cents_after_threshold: cents(d.onboarder_referral_cents_after_threshold),
        threshold_companies: parseInt(d.threshold_companies, 10),
        full_rate_card_cents: cents(d.full_rate_card_cents),
      });
      flash('Rates saved.', true); await renderMoney();
    }catch(err){ flash(err.message); }
  });
}

// What a rep sees of their own money: this month's statement and the running
// balance. Nothing about any other rep, no pay rates, no way to record a
// payment — Joseph does that, and the server refuses it from here anyway.
async function renderMyMoney(){
  await loadReps();
  const me = state.reps[0];
  if(!me){ $('tab-mymoney').innerHTML = '<div class="notice">No earnings yet.</div>'; return; }
  const month = state.month || todayYmd().slice(0, 7);
  const s = await api('/reps/' + me.id + '/statement?month=' + month);
  const label = { activation: 'Sign-up bonus', referral: 'Referral royalty', reversal: 'Adjustment' };
  $('tab-mymoney').innerHTML =
    '<div class="head"><h2>My money</h2><div class="inline"><button class="btn secondary" id="myReportBtn" type="button">My year in numbers</button><label style="margin:0">Month</label><input type="month" id="myMonth" value="' + esc(month) + '" style="width:auto"></div></div>' +
    '<div class="cards">' +
      '<div class="stat"><b>' + dollars(me.owed_cents) + '</b><span>Owed to you right now</span></div>' +
      '<div class="stat"><b>' + dollars(s.activation_cents + s.royalty_cents + s.reversal_cents) + '</b><span>Earned in ' + esc(monthLabel(s.month)) + '</span></div>' +
      '<div class="stat"><b>' + dollars(s.paid_cents) + '</b><span>Paid to you in ' + esc(monthLabel(s.month)) + '</span></div></div>' +
    '<div class="tablewrap"><table><thead><tr><th>When</th><th>What</th><th class="num">Amount</th></tr></thead><tbody>' +
    (s.lines.map((l) =>
      '<tr><td>' + esc(dateOnly(l.at)) + '</td>' +
      '<td>' + esc(label[l.kind] || l.kind) + ' <span class="muted">· ' + esc(l.dealer || '') + '</span></td>' +
      '<td class="num">' + dollarCell(l.amount_cents) + '</td></tr>'
    ).join('') || '<tr><td colspan="3" class="muted" style="padding:18px">Nothing earned this month yet.</td></tr>') +
    '</tbody></table></div>' +
    (s.payouts.length
      ? '<h3 style="font-size:15px;margin:18px 0 8px">Payments from 50.</h3><div class="tablewrap"><table><tbody>' +
        s.payouts.map((p) => '<tr><td>' + esc(plainDate(p.paid_on)) + '</td><td>' + esc([p.method, p.note].filter(Boolean).join(' · ')) + '</td><td class="num">' + dollars(p.amount_cents) + '</td></tr>').join('') +
        '</tbody></table></div>'
      : '') +
    '<p class="muted" style="margin-top:14px">A sign-up bonus lands once the company has actually paid 50. Royalties land as their customers\' referrals are rewarded. Both can take up to an hour to show here.</p>';
  $('myMonth').addEventListener('change', (e) => { if(e.target.value){ state.month = e.target.value; renderMyMoney().catch((err) => flash(err.message)); } });
  $('myReportBtn').addEventListener('click', () => repReport(me.id));
}

function payDialog(repId, suggestedCents){
  const r = state.money.reps.find((x) => x.id === repId);
  const owed = Math.max(0, r.owed_cents);
  openDialog('<h3>Record a payment to ' + esc(r.name) + '</h3><p class="muted">You owe ' + dollars(r.owed_cents) + ' right now. This records that you paid them — it does not send money.</p>' +
    '<form id="payForm"><div class="row"><div><label>Amount ($)</label><input name="amount" type="number" min="0.01" step="0.01" required value="' + ((suggestedCents || owed) / 100).toFixed(2) + '"></div>' +
    '<div><label>Date paid</label><input name="paid_on" type="date" required value="' + todayYmd() + '"></div></div>' +
    '<div class="row"><div><label>How (Zelle, check…)</label><input name="method" maxlength="60"></div><div><label>For statement month</label><input name="period" type="month" value="' + esc(state.month) + '"></div></div>' +
    '<label>Note</label><input name="note" maxlength="500"><div class="actions"><button type="button" class="btn secondary" id="cancelDlg">Cancel</button><button class="btn" type="submit">Record payment</button></div></form>');
  $('cancelDlg').addEventListener('click', closeDialog);
  $('payForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = formData(e.target);
    try{
      await post('/reps/' + repId + '/payouts', { amount_cents: Math.round(Number(d.amount) * 100), paid_on: d.paid_on, period: d.period || null, method: d.method || null, note: d.note || null });
      closeDialog(); flash('Payment recorded.', true); await renderMoney();
    }catch(err){ flash(err.message); closeDialog(); }
  });
}

async function statementDialog(repId){
  const s = await api('/reps/' + repId + '/statement?month=' + state.month);
  const label = { activation: 'Sign-up bonus', referral: 'Referral royalty', reversal: 'Reversal' };
  const lineDetail = (l) => {
    const d = l.detail || {};
    if(l.kind === 'referral'){
      const per = d.reward_per_card_cents != null ? ' · ' + dollars(d.reward_per_card_cents) + ' cards' : '';
      const late = d.after_threshold ? ' · company #' + d.company_number + ' (reduced rate)' : '';
      return per + late;
    }
    if(l.kind === 'reversal') return d.reason === 'manual' ? (d.note ? ' · ' + esc(d.note) : ' · reversed by hand') : ' · ' + esc(String(d.reason || '').replace(/_/g, ' '));
    return '';
  };
  const reversible = new Set(s.lines.filter((l) => l.reversal_of).map((l) => l.reversal_of));
  openDialog(
    '<div class="noprint actions" style="justify-content:space-between;margin:0 0 6px"><span></span><button class="btn small secondary" id="printStmt" type="button">Print</button></div>' +
    '<h3>' + esc(s.rep.name) + ' — ' + esc(monthLabel(s.month)) + '</h3>' +
    '<p class="muted">Statement from 50. · ' + esc(s.rep.email || '') + '</p>' +
    '<div class="tablewrap" style="margin:10px 0"><table style="min-width:0"><tbody>' +
      '<tr><td>Owed at the start of the month</td><td class="num">' + dollarCell(s.opening_cents) + '</td></tr>' +
      '<tr><td>Sign-up bonuses</td><td class="num">' + dollarCell(s.activation_cents) + '</td></tr>' +
      '<tr><td>Referral royalties</td><td class="num">' + dollarCell(s.royalty_cents) + '</td></tr>' +
      (s.reversal_cents ? '<tr><td>Reversals</td><td class="num">' + dollarCell(s.reversal_cents) + '</td></tr>' : '') +
      '<tr><td>Paid this month</td><td class="num">' + dollarCell(-s.paid_cents) + '</td></tr>' +
      '<tr><td><b>Owed at the end of the month</b></td><td class="num"><b>' + dollarCell(s.closing_cents) + '</b></td></tr></tbody></table></div>' +
    '<h3 style="font-size:15px;margin-top:14px">Earnings</h3>' +
    '<div class="tablewrap"><table style="min-width:0"><tbody>' +
      (s.lines.map((l) => '<tr><td>' + esc(dateOnly(l.at)) + '</td><td>' + esc(label[l.kind] || l.kind) + ' <span class="muted">· ' + esc(l.role) + ' · ' + esc(l.dealer || '') + lineDetail(l) + '</span></td><td class="num">' + dollarCell(l.amount_cents) + '</td>' +
        '<td class="noprint num">' + (l.kind !== 'reversal' && !reversible.has(l.id) ? '<button class="btn small danger" data-rev="' + l.id + '">Reverse</button>' : '') + '</td></tr>').join('') || '<tr><td class="muted" style="padding:14px">Nothing earned this month.</td></tr>') +
    '</tbody></table></div>' +
    (s.payouts.length ? '<h3 style="font-size:15px;margin-top:14px">Payments</h3><div class="tablewrap"><table style="min-width:0"><tbody>' +
      s.payouts.map((p) => '<tr><td>' + esc(plainDate(p.paid_on)) + '</td><td>' + esc([p.method, p.note].filter(Boolean).join(' · ')) + '</td><td class="num">' + dollars(p.amount_cents) + '</td><td class="noprint num"><button class="btn small danger" data-delpay="' + p.id + '">Delete</button></td></tr>').join('') + '</tbody></table></div>' : '') +
    '<div class="actions noprint"><button class="btn secondary" id="cancelDlg" type="button">Close</button><button class="btn" id="payFromStmt" type="button">Record payment</button></div>'
  );
  $('cancelDlg').addEventListener('click', closeDialog);
  $('printStmt').addEventListener('click', () => window.print());
  $('payFromStmt').addEventListener('click', () => { closeDialog(); payDialog(repId, s.closing_cents > 0 ? s.closing_cents : 0); });
  $('dlg').querySelectorAll('[data-rev]').forEach((b) => b.addEventListener('click', async () => {
    const note = window.prompt('Reverse this earning? Add a short reason (for example "refunded in Stripe"):', '');
    if(note === null) return;
    try{ await post('/rep-earnings/' + b.dataset.rev + '/reverse', { note }); closeDialog(); flash('Reversed.', true); await renderMoney(); statementDialog(repId); }catch(err){ flash(err.message); }
  }));
  $('dlg').querySelectorAll('[data-delpay]').forEach((b) => b.addEventListener('click', async () => {
    if(!window.confirm('Delete this payment record? What you owe goes back up by that amount.')) return;
    try{ await api('/rep-payouts/' + b.dataset.delpay, { method:'DELETE' }); closeDialog(); flash('Payment deleted.', true); await renderMoney(); statementDialog(repId); }catch(err){ flash(err.message); }
  }));
}

/* ---------- boot ---------- */
(async function(){
  const fromLink = readAuthFragment();
  if(fromLink && fromLink.error){
    clearFragment();
    const m = $('loginMsg');
    m.textContent = fromLink.error + ' Ask Joseph to send you a fresh link.';
    m.className = 'msg show err';
    return;
  }
  if(fromLink){
    setSession({ access_token: fromLink.access_token, refresh_token: fromLink.refresh_token });
    clearFragment();
    // recovery and invite both mean "they have no password yet, or are
    // replacing one". Anything else is an ordinary session and goes straight in.
    if(fromLink.type === 'recovery' || fromLink.type === 'invite' || fromLink.type === 'signup'){
      return showSetPassword(await whoAmI());
    }
  }
  if(getSession()) { const ok = await start().then(() => true).catch(() => false); void ok; }
})();
</script>
