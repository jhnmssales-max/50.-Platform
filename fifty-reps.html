  { key:'cardNoun', stage:'Their invite email, and their share page', label:'What the gift card is called', max:60,
    where:'Used wherever the reward is named, right after the amount. Change it for a business that mails real cards rather than emailing them.',
    generic:'electronic gift card' },
  { key:'shareTitle', stage:'Their invite email, and their share page', label:'Title when a customer shares their link', max:200,
    where:'The heading on a phone’s share sheet.',
    generic:'Get {reward} when you make a purchase from {name}' },
  { key:'shareText', stage:'Their invite email, and their share page', label:'Message the share sheet fills in', multiline:true, max:400,
    where:'What their customer sends a friend, before they edit it.',
    generic:'I referred you — make your purchase through my link and we both get {reward}.' },
  { key:'friendAction', stage:'The page the referred friend lands on', label:'What the friend has to do', max:120,
    where:'Finishes “When you …, you and your friend each get a card.” A few words.',
    generic:'make your purchase' },
  { key:'afterPurchase', stage:'The page the referred friend lands on', label:'The same thing, past tense', max:120,
    where:'Finishes “Once you have …” on the screen after they send the form.',
    generic:'made your purchase' },
  { key:'inquiryNoun', stage:'The page the referred friend lands on', label:'What their form submission is called', max:120,
    where:'Used on the privacy page, e.g. “we keep your roofing inquiry”.',
    generic:'inquiry' },
  { key:'eligibility', stage:'Their terms page', label:'Who can take part', max:300,
    where:'Finishes “Anyone who has … may refer a friend.”',
    generic:'have made a purchase with us' },
  { key:'qualifyingEvent', stage:'Their terms page', label:'What earns the reward', max:300,
    where:'Finishes “A reward is earned when the referred friend …”',
    generic:'places and completes a qualifying order' },
  { key:'rewardCondition', stage:'Their terms page', label:'What they confirm before a card goes out', multiline:true, max:600,
    where:'Finishes “Cards are sent once …” — this is what keeps them from paying on a cancelled order.',
    generic:'confirms the referred order has actually been placed and a qualifying deposit received. Cancelled, refunded, or unfulfilled orders do not qualify for a reward.' },
];

// The three steps, and which fields belong to each. Grouped by the page the
// words come out on, which is also the order a customer meets them in.
const WORDING_STEPS = [
  { title:'What their past customers get', keys:['offerHow','cardNoun','shareTitle','shareText'] },
  { title:'The page their friend lands on', keys:['friendAction','afterPurchase','inquiryNoun'] },
  { title:'Their terms page',               keys:['eligibility','qualifyingEvent','rewardCondition'] },
];

// The pictures and pin coordinates, built by api/scripts/build-wording-shots.js
// from the real pages. Fetched once, lazily, and never load-bearing: a rep in
// a bad signal area still gets every box and can still save.
let WSHOTS = null;
let wshotsPromise = null;
function loadWordingShots(){
  if(WSHOTS) return Promise.resolve(WSHOTS);
  if(!wshotsPromise){
    // no-cache, NOT force-cache. force-cache serves whatever the browser
    // already has without ever asking whether it changed, so adding a tenth
    // field shipped a manifest nobody received: the page kept the nine-field
    // copy, found no entry for the new box, and showed "No picture for this
    // one yet" with no sentence under it. Every future change to the
    // pictures would have been invisible the same way.
    // no-cache still sends the ETag and still gets a 304 when nothing has
    // changed, so this costs a round trip, not a download.
    wshotsPromise = fetch('assets/wording/manifest.json', { cache:'no-cache' })
      .then((r) => r.ok ? r.json() : Promise.reject(new Error('no manifest')))
      .then((m) => { WSHOTS = m; return m; })
      .catch(() => null);
  }
  return wshotsPromise;
}

// Which picture pins a given field, and where on it.
function wmarkFor(key){
  if(!WSHOTS) return null;
  for(const shot of WSHOTS.shots){
    const mark = shot.marks.find((m) => m.key === key);
    if(mark) return { shot, mark };
  }
  return null;
}

// {name} is substituted because the page knows the business being set up, so
// the preview reads like a finished sentence. {reward} is deliberately LEFT
// as a token: the card amount is set per dealer and is not known at lead
// stage, so printing "$50" would be a guess -- and would put a money figure
// in front of a helper, who is not supposed to see one anywhere on this page.
// `card` is whatever is currently typed in the gift-card box, so the offer
// line's preview follows it as the rep types rather than promising an
// emailed card to a business that posts them.
function wfill(text, name, card){
  return String(text == null ? '' : text)
    .replace(/\*\*/g, '')
    .replace(/\{name\}/g, name || 'their business')
    .replace(/\{card\}/g, card || 'electronic gift card');
}

// What the rep has typed into the gift-card box right now, or the fallback.
function currentCardNoun(scope){
  const el = (scope || document).querySelector('[data-wkey="cardNoun"], [name="copy_cardNoun"]');
  const typed = el && el.value ? el.value.trim() : '';
  if(typed) return typed;
  const f = COPY_FIELDS.find((x) => x.key === 'cardNoun');
  return (f && f.generic) || 'electronic gift card';
}

// Every box carries its generic wording as the placeholder, so an empty box
// shows exactly what will run instead of looking like something is missing.
// `name` is the business being set up, used only to make the preview read
// naturally; it is never saved.
function copyFieldsHtml(values, name){
  const v = values || {};
  const uid = 'w' + Math.random().toString(36).slice(2, 8);
  const tabs = WORDING_STEPS.map((st, i) =>
    '<button type="button" class="wstep' + (i ? '' : ' on') + '" data-wstep="' + i + '">' +
      '<span class="n">' + (i + 1) + '</span>' + esc(st.title) + '</button>').join('');

  const panes = WORDING_STEPS.map((st, i) => {
    const boxes = st.keys.map((key) => {
      const f = COPY_FIELDS.find((x) => x.key === key);
      const val = esc(v[key] || '');
      const common = 'name="copy_' + key + '" maxlength="' + f.max + '" data-wkey="' + esc(key) + '" ' +
        'placeholder="' + esc(wfill(f.generic, name, null)) + '"';
      return '<div class="wbox" data-wbox="' + esc(key) + '">' +
        '<label>' + esc(f.label) + '</label>' +
        (f.multiline
          ? '<textarea ' + common + ' rows="3">' + val + '</textarea>'
          : '<input ' + common + ' value="' + val + '">') +
        '<div class="wrow">' +
          '<button type="button" class="btn small secondary" data-wuse="' + esc(key) + '">Use this wording</button>' +
          '<span class="wcount" data-wcount="' + esc(key) + '"></span>' +
        '</div>' +
        '<p class="wprev" data-wprev="' + esc(key) + '" hidden></p>' +
        '<p class="hint">' + esc(f.where) + '</p>' +
      '</div>';
    }).join('');
    return '<section class="wpane' + (i ? '' : ' on') + '" data-wpane="' + i + '">' +
      '<p class="wtitle">' + esc(st.title) + '</p>' +
      '<div class="wshot" data-wshot><p class="wshotmsg">Loading the page these words land on…</p></div>' +
      '<div class="wfields">' + boxes + '</div></section>';
  }).join('');

  return '<div class="wiz" data-wiz="' + uid + '" data-wname="' + esc(name || '') + '">' +
    '<div class="wizsteps">' + tabs + '</div>' + panes +
    '<div class="wnav">' +
      '<button type="button" class="btn small secondary" data-wnav="back" disabled>Back</button>' +
      '<span class="wpos">Step 1 of ' + WORDING_STEPS.length + '</span>' +
      '<button type="button" class="btn small" data-wnav="next">Next</button>' +
    '</div></div>';
}

// Called after the markup is on the page. Safe to call twice on the same
// scope: a wizard already wired is skipped.
function wireWording(scope){
  (scope || document).querySelectorAll('.wiz').forEach((wiz) => {
    if(wiz.dataset.wired) return;
    wiz.dataset.wired = '1';
    const name = wiz.dataset.wname || '';
    let step = 0;
    let active = WORDING_STEPS[0].keys[0];
    let drawn = false;

    const paneOf = (i) => wiz.querySelector('[data-wpane="' + i + '"]');
    // Declared here so the focus handler below can reach it before the
    // observer that normally triggers the first draw has fired.
    let firstDrawOnFocus = (key) => { active = key; };

    // The picture for whichever box the rep is in. Scrolled so the pin is in
    // view rather than leaving them to hunt for it on a long terms page.
    function showShot(key){
      active = key;
      const found = wmarkFor(key);
      const pane = paneOf(step);
      const host = pane && pane.querySelector('[data-wshot]');
      if(!host) return;
      wiz.querySelectorAll('.wbox').forEach((b) => b.classList.toggle('act', b.dataset.wbox === key));
      if(!found){
        // No manifest (offline, or the pictures were never built). The boxes
        // still work; only the illustration is missing.
        host.innerHTML = '<p class="wshotmsg">' + (WSHOTS ? 'No picture for this one yet.' : 'Pictures unavailable offline — the boxes still work.') + '</p>';
        return;
      }
      const { shot, mark } = found;
      host.innerHTML = '<div class="wscroll"><img alt="' + esc(shot.title) + '" src="' + esc(shot.img) + '">' +
        '<div class="wpin"></div></div>' +
        '<div class="wshotcap"><span>' + esc(shot.title) + '</span><span>tap to zoom</span></div>';
      const scroll = host.querySelector('.wscroll');
      const img = scroll.querySelector('img');
      const pin = scroll.querySelector('.wpin');
      const place = () => {
        const scale = img.clientWidth / shot.page.w;
        pin.style.left = (mark.box.x * scale) + 'px';
        pin.style.top = (mark.box.y * scale) + 'px';
        pin.style.width = Math.max(mark.box.w * scale, 6) + 'px';
        pin.style.height = Math.max(mark.box.h * scale, 6) + 'px';
        // Long pages (the terms page is 1500px) open scrolled to the pin
        // rather than at the top, so the rep is not left hunting for it.
        scroll.scrollTop = Math.max(0, (mark.box.y * scale) - (scroll.clientHeight / 2) + 20);
        scroll.scrollLeft = Math.max(0, (mark.box.x * scale) - (scroll.clientWidth / 2));
      };
      if(img.complete) place(); else img.addEventListener('load', place, { once:true });
      // onclick, not addEventListener: the host element survives every
      // showShot while its contents are replaced, so adding a listener would
      // stack one per picture change and a single tap would toggle zoom
      // several times over.
      host.onclick = () => {
        host.classList.toggle('zoom');
        img.style.width = host.classList.contains('zoom') ? shot.page.w + 'px' : '';
        requestAnimationFrame(place);
      };
    }

    // The sentence the rep's words land inside. Blank for the three fields
    // that are whole sentences on their own -- there is nothing to wrap.
    function showPreview(key){
      const el = wiz.querySelector('[data-wprev="' + key + '"]');
      const input = wiz.querySelector('[data-wkey="' + key + '"]');
      const found = wmarkFor(key);
      if(!el || !input) return;
      const f = COPY_FIELDS.find((x) => x.key === key);
      const typed = input.value.trim();
      if(!found || (!found.mark.before && !found.mark.after)){ el.hidden = true; return; }
      const card = currentCardNoun(wiz);
      const words = wfill(typed || f.generic, name, card);
      el.hidden = false;
      el.classList.toggle('gen', !typed);
      el.innerHTML = (typed ? '' : '<span class="muted">If left empty: </span>') +
        esc(wfill(found.mark.before, name, card)) + '<b>' + esc(words) + '</b>' + esc(wfill(found.mark.after, name, card));
      // The preview may grow but must never shrink. Typing removes the
      // "If left empty:" prefix and changes the words, so the sentence can
      // rewrap to one line SHORTER -- and everything below it, including the
      // next box's button, slides UP under the rep's cursor mid-click.
      // Whether it rewraps at all is luck of the wrap: it depends on the
      // company name, what they typed and the column width, so it cannot be
      // chased one string at a time. A high-water mark removes the whole
      // class of it. Measured only once it has a box -- inside a shut
      // <details> offsetHeight is 0 and would lock it flat.
      const seen = Number(el.dataset.tall || 0);
      const now = el.offsetHeight;
      if(now > 0){
        const tall = Math.max(seen, now);
        el.dataset.tall = String(tall);
        el.style.minHeight = tall + 'px';
      }
    }

    // Every box's fallback is shown as its placeholder, and the offer line's
    // fallback contains {card}. Re-render them when the card's name changes,
    // so a rep who types "gift card in the mail" sees the offer line say it
    // too rather than still reading "electronic gift card".
    function refreshPlaceholders(){
      const card = currentCardNoun(wiz);
      wiz.querySelectorAll('[data-wkey]').forEach((el) => {
        const f = COPY_FIELDS.find((x) => x.key === el.dataset.wkey);
        if(f) el.placeholder = wfill(f.generic, name, card);
      });
    }

    function count(key){
      const input = wiz.querySelector('[data-wkey="' + key + '"]');
      const out = wiz.querySelector('[data-wcount="' + key + '"]');
      const f = COPY_FIELDS.find((x) => x.key === key);
      if(input && out) out.textContent = input.value.length + ' / ' + f.max;
    }

    function goto(i){
      step = Math.max(0, Math.min(WORDING_STEPS.length - 1, i));
      wiz.querySelectorAll('[data-wpane]').forEach((p) => p.classList.toggle('on', +p.dataset.wpane === step));
      wiz.querySelectorAll('[data-wstep]').forEach((b) => {
        b.classList.toggle('on', +b.dataset.wstep === step);
        // A step counts as done once any of its boxes has the rep's own words.
        const filled = WORDING_STEPS[+b.dataset.wstep].keys
          .some((k) => { const el = wiz.querySelector('[data-wkey="' + k + '"]'); return el && el.value.trim(); });
        b.classList.toggle('done', filled && +b.dataset.wstep !== step);
      });
      wiz.querySelector('.wpos').textContent = 'Step ' + (step + 1) + ' of ' + WORDING_STEPS.length;
      wiz.querySelector('[data-wnav="back"]').disabled = step === 0;
      const next = wiz.querySelector('[data-wnav="next"]');
      next.textContent = step === WORDING_STEPS.length - 1 ? 'Done' : 'Next';
      active = WORDING_STEPS[step].keys[0];
      // Re-measure this step's previews now that its pane is visible. Panes
      // start display:none, where offsetHeight is 0, so a preview rendered at
      // wire time never recorded how tall it is. Without this the first real
      // measurement happens on the rep's first keystroke -- after the
      // sentence has already rewrapped shorter -- and the floor locks in at
      // the shrunk height, which is the bug it is meant to prevent.
      WORDING_STEPS[step].keys.forEach(showPreview);
      if(drawn) showShot(active);
    }

    wiz.querySelectorAll('[data-wstep]').forEach((b) =>
      b.addEventListener('click', () => goto(+b.dataset.wstep)));
    wiz.querySelector('[data-wnav="back"]').addEventListener('click', () => goto(step - 1));
    wiz.querySelector('[data-wnav="next"]').addEventListener('click', () => {
      if(step < WORDING_STEPS.length - 1) goto(step + 1);
      else {
        // On the last step "Done" hands over to whatever is wrapping the
        // wizard -- the dialog's own Save button, or the add-lead form.
        const save = (wiz.closest('form') || document).querySelector('#saveWording, [type="submit"]');
        if(save) save.focus();
      }
    });

    wiz.querySelectorAll('[data-wkey]').forEach((input) => {
      const key = input.dataset.wkey;
      count(key);
      input.addEventListener('focus', () => { if(drawn) showShot(key); else firstDrawOnFocus(key); });
      input.addEventListener('input', () => {
        // The card's name appears inside other boxes' sentences, so changing
        // it has to redraw them all, not only its own.
        if(key === 'cardNoun'){
          WORDING_STEPS.forEach((st) => st.keys.forEach(showPreview));
          refreshPlaceholders();
        } else {
          showPreview(key);
        }
        count(key);
      });
    });

    wiz.querySelectorAll('[data-wuse]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.wuse;
        const input = wiz.querySelector('[data-wkey="' + key + '"]');
        const f = COPY_FIELDS.find((x) => x.key === key);
        if(!input) return;
        // Dropped in raw, with {reward} and {name} intact: those are replaced
        // per dealer at render time, so baking in "$50" here would freeze the
        // amount for a dealer whose card is not $50.
        input.value = f.generic;
        input.focus();
        showPreview(key); count(key);
      });
    });

    WORDING_STEPS.forEach((st) => st.keys.forEach(showPreview));
    goto(0);

    // No PICTURE is fetched until the wizard is actually on screen. On the
    // add-a-lead form it sits inside a <details> that starts shut, and most
    // leads are written down without ever opening it -- a rep on cellular in
    // someone's driveway should not pay for an image they never look at.
    // An element inside a closed <details> has no box, so it never
    // intersects; opening it is what triggers the first draw.
    // The manifest is about 5KB and carries the sentences that wrap each box
    // -- the whole point of the rebuild -- so it is fetched straight away and
    // the previews fill in as soon as it lands. The pictures are about 630KB
    // between them and wait for firstDraw() below.
    loadWordingShots().then(() => {
      if(WSHOTS) WORDING_STEPS.forEach((st) => st.keys.forEach(showPreview));
      if(drawn) showShot(active);
    });

    firstDrawOnFocus = (key) => { active = key; firstDraw(); };
    const firstDraw = () => {
      if(drawn) return;
      drawn = true;
      loadWordingShots().then(() => showShot(active));
    };
    if(typeof IntersectionObserver === 'function'){
      const io = new IntersectionObserver((entries) => {
        if(entries.some((e) => e.isIntersecting)){ io.disconnect(); firstDraw(); }
      });
      io.observe(wiz);
    } else {
      firstDraw();
    }
  });
}

// Pulls the boxes back out. A box left empty is simply absent, which is what
// tells the API to use the generic wording for that line.
function readCopyFields(form){
  const out = {};
  COPY_FIELDS.forEach((f) => {
    const el = form.querySelector('[name="copy_' + f.key + '"]');
    const t = el && el.value ? el.value.trim() : '';
    if(t) out[f.key] = t;
  });
  return out;
}

function copyCount(copy){
  return copy ? COPY_FIELDS.filter((f) => copy[f.key]).length : 0;
}

// The summary line on the add-a-lead form and the lead row: says how much of
// it is their own words rather than showing nine fields' worth of text.
function wordingSummary(copy){
  const n = copyCount(copy);
  if(!n) return 'nothing written yet — generic wording will be used';
  return n + ' of ' + COPY_FIELDS.length + ' in their own words';
}

/* ---------- finding something in a long list ---------- */
// Filters the rows already on the page rather than asking the API again:
// instant, keeps the cursor where it is, and every list here is already
// loaded in full. Each row carries a data-search attribute built from the
// fields worth matching, rather than matching the row's text — a Companies
// row contains a dropdown listing every rep, so matching its text would make
// a rep's name match every company.
const SEARCH = { leads:'', dealers:'', reps:'' };

function searchBox(key, placeholder){
  return '<div class="searchrow">' +
    '<input type="search" class="searchbox" data-search-for="' + key + '" placeholder="' + esc(placeholder) + '" ' +
      'value="' + esc(SEARCH[key] || '') + '" autocomplete="off" spellcheck="false">' +
    '<span class="muted" data-search-count="' + key + '"></span></div>';
}

function searchable(parts){
  return esc(parts.filter(Boolean).join(' ').toLowerCase());
}

// Every word has to appear somewhere in the row, in any order — so "silver
// roof" finds Silver Run Home Improvements (roofing) without needing the
// words adjacent or in the right order.
function applySearch(tabId, key){
  const q = (SEARCH[key] || '').trim().toLowerCase();
  const words = q ? q.split(/\s+/) : [];
  const rows = $(tabId).querySelectorAll('tbody tr[data-search]');
  let shown = 0;
  rows.forEach((tr) => {
    const hay = tr.getAttribute('data-search') || '';
    const hit = words.every((w) => hay.includes(w));
    tr.hidden = !hit;
    if(hit) shown += 1;
  });
  const count = $(tabId).querySelector('[data-search-count="' + key + '"]');
  if(count){
    count.textContent = !q ? ''
      : (shown ? shown + ' of ' + rows.length : 'nothing matches “' + q + '”');
  }
}

// Take whatever is physically in the box right now as the query, immediately
// before a redraw rebuilds it from SEARCH[key]. Called there and nowhere else:
// a render builds its HTML in one go from that variable, and a keystroke
// landing while the fetch was still in flight updates the box but only reaches
// SEARCH through an input handler that the box may not have yet. The box is
// what the person can see, so the box wins.
function captureSearch(tabId, key){
  const el = $(tabId);
  const box = el && el.querySelector('[data-search-for="' + key + '"]');
  if(box) SEARCH[key] = box.value;
}
function wireSearch(tabId, key){
  const box = $(tabId).querySelector('[data-search-for="' + key + '"]');
  if(!box) return;
  box.addEventListener('input', () => { SEARCH[key] = box.value; applySearch(tabId, key); });
  // Typing filters rows already on the page and never redraws the tab, so the
  // cursor is never taken away mid-search. A redraw from something else —
  // adding a lead, saving an assignment — rebuilds the box with the query
  // still in it, and deliberately does not grab focus back: someone may have
  // been typing in the form above it.
  applySearch(tabId, key);
}

/* ---------- Leads ---------- */
async function renderLeads(){
  // Anything half-typed into the add-a-lead form, and whether it was open at
  // all, has to survive this redraw: the list reloads whenever a lead changes,
  // and losing a lead someone was in the middle of writing down is the kind of
  // thing that makes people stop using a tool.
  const keep = (() => {
    const details = $('tab-leads').querySelector('details');
    if(!details) return null;
    const values = {};
    $('tab-leads').querySelectorAll('#leadForm input, #leadForm textarea, #leadForm select').forEach((el) => {
      if(el.name && el.value) values[el.name] = el.value;
    });
    const wording = $('tab-leads').querySelector('details.wording');
    return { open: details.open, wordingOpen: wording ? wording.open : false, values, focused: (document.activeElement || {}).name || null };
  })();

  const [l, dl] = await Promise.all([api('/rep-leads'), api('/rep-dealers')]);
  state.leads = l.leads; state.dealers = dl.dealers;
  // The API caps the rows it sends and now reports the real totals, so these
  // come from the database rather than from the length of what arrived. They
  // used to be the same number, which is why nothing looked wrong until the
  // 501st lead would have quietly stopped existing.
  state.leadTotal = (typeof l.total === 'number') ? l.total : state.leads.length;
  const open = (typeof l.open_total === 'number') ? l.open_total : state.leads.filter((x) => x.status === 'open').length;
  const capped = state.leads.length < state.leadTotal;

  // A won lead is not a lead any more -- it is a company, and it belongs on
  // the Companies tab. Keeping it here left a row nobody would act on again,
  // and it is what forced the "Won by" column onto this table, which is what
  // pushed the table wider than its container and put the sticky action
  // column on top of the rightmost column.
  //
  // Hidden rather than dropped, behind the same toggle the Companies tab
  // already uses for closed companies: between winning and Joseph building
  // it, a won lead is on no other screen a REP can reach, and the rep who
  // closed it is the person most likely to wonder where it went.
  const wonLeads = state.leads.filter((x) => x.status === 'won');
  const shown = state.showWonLeads ? state.leads : state.leads.filter((x) => x.status !== 'won');
  // With no won leads on screen there is nothing for a "Won by" column to
  // say, so it goes too -- that is the column that did not fit.
  const showWonBy = !state.isRep && state.showWonLeads;
  captureSearch('tab-leads', 'leads');
  $('tab-leads').innerHTML =
    '<div class="head"><h2>Leads</h2><span class="muted">' + open + ' open · ' + state.leadTotal + ' total' +
      (capped ? ' · showing the newest ' + state.leads.length : '') + '</span></div>' +
    (wonLeads.length
      ? '<p class="muted" style="margin:-6px 0 10px"><button type="button" class="linkish" id="toggleWon">' +
        (state.showWonLeads
          ? 'Hide won leads'
          : 'Show won leads (' + wonLeads.length + ')') + '</button>' +
        (state.showWonLeads ? '' : ' <span class="muted">— they are on the Companies tab once built.</span>') + '</p>'
      : '') +
    (capped
      ? '<div class="notice">This tab shows the newest ' + state.leads.length + ' of ' + state.leadTotal +
        ' leads. Filter by status, or search, to reach the rest.</div>'
      : '') +
    '<details class="card" ' + (state.leads.length ? '' : 'open') + '><summary>Add a lead</summary>' +
      '<form id="leadForm"><div class="row">' +
        '<div><label>Company</label><input name="company_name" required maxlength="200"></div>' +
        '<div><label>Website</label><input name="website" maxlength="300" placeholder="theircompany.com"></div></div>' +
      '<div class="row"><div><label>Contact name</label><input name="contact_name" maxlength="120"></div>' +
        '<div><label>Phone</label><input name="phone" maxlength="50"></div></div>' +
      '<div class="row"><div><label>Email</label><input name="email" type="email" maxlength="200"></div>' +
        (state.isRep ? '' : '<div><label>Brought in by</label><select name="brought_in_by_rep_id">' + repOptions('', { blank: '— nobody / me —', activeOnly: true }) + '</select></div>') +
        '<div><label>Date</label><input name="found_on" type="date" value="' + todayYmd() + '"></div></div>' +
      '<label>Notes</label><textarea name="notes" rows="2" maxlength="2000" placeholder="Where you met them, what they want, what to follow up on."></textarea>' +
      // Optional on purpose: a rep on the phone closing a deal should not be
      // blocked by nine boxes. Anything left empty runs the generic wording,
      // and the lead can be opened again later to fill it in.
      '<details class="wording"><summary>What their customers will read \u2014 optional</summary>' +
        '<p class="hint" style="margin:6px 0 0">Their words, in their trade. Leave a box empty and the wording underneath it is used instead. ' +
        '<b>{reward}</b> becomes their gift card amount and <b>{name}</b> their business name.</p>' +
        copyFieldsHtml(null) +
      '</details>' +
      '<div class="actions"><button class="btn" type="submit">Add lead</button></div></form>' +
      '<div id="dupBox"></div></details>' +
    searchBox('leads', state.isRep ? 'Search your leads \u2014 company, contact, email, phone' : 'Search leads \u2014 company, contact, email, phone') +
    '<div class="tablewrap"><table><thead><tr><th>Company</th><th>Contact</th>' + (state.isRep ? '' : '<th>Brought in by</th>') + '<th>Found</th><th>Status</th>' + (showWonBy ? '<th>Won by</th>' : '') + '<th></th></tr></thead><tbody>' +
    (shown.map((x) =>
      '<tr data-search="' + searchable([x.company_name, x.contact_name, x.phone, x.email, x.website, x.notes, x.status]) + '"><td><b>' + esc(x.company_name) + '</b>' +
        (x.website ? '<div class="muted">' + esc(x.website) + '</div>' : '') +
        (x.notes ? '<div class="muted">' + esc(x.notes) + '</div>' : '') +
        '<div class="muted">Wording: ' + esc(wordingSummary(x.copy)) + '</div></td>' +
      // Phone and email on one line made this the widest column in the table
      // -- wide enough that the whole table could not fit its card, and the
      // sticky action column then covered Status. One line each costs no
      // height worth having and reads better on a card.
      '<td data-label="Contact">' + esc(x.contact_name || '') +
        (x.phone ? '<div class="muted">' + esc(x.phone) + '</div>' : '') +
        (x.email ? '<div class="muted">' + esc(x.email) + '</div>' : '') + '</td>' +
      (state.isRep ? '' : '<td data-label="Brought in by"' + (repName(x.brought_in_by_rep_id) ? '' : ' class="nomob"') + '>' + esc(repName(x.brought_in_by_rep_id) || '—') + '</td>') +
      // A bare date makes you do the arithmetic. The age is the thing you
      // actually want: an open lead sitting 47 days is the one to chase, and
      // past 30 it says so in its own right. Only open leads -- a won or
      // lost lead's age is history, not a prompt.
      '<td data-label="Found">' + esc(plainDate(x.found_on)) +
        (x.status === 'open' && daysSince(x.found_on) !== null
          ? '<div class="muted" style="font-size:12px"><span' +
            (daysSince(x.found_on) >= 30 ? ' class="warn"' : '') + '>open ' +
            daysSince(x.found_on) + ' day' + (daysSince(x.found_on) === 1 ? '' : 's') + '</span></div>'
          : '') + '</td>' +
      '<td data-label="Status"><span class="pill ' + x.status + '">' + x.status + '</span></td>' +
      (showWonBy ? '<td data-label="Won by"' + (x.status === 'won' ? '' : ' class="nomob"') + '>' + (x.status === 'won' ? esc(repName(x.closed_by_rep_id)) + (x.onboarded_by_rep_id ? '<div class="muted">onboarded by ' + esc(repName(x.onboarded_by_rep_id)) + '</div>' : '') : '') + '</td>' : '') +
      // Edit sits on every row the viewer can see. The database already
      // decides who may change what -- rep_leads_own_update lets a rep touch
      // only leads they brought in or closed, rep_leads_platform_staff_update
      // lets Joseph touch any -- and a rep is only ever shown their own, so
      // every row in front of someone is one they may edit.
      // Three buttons at most, not seven. Seven covered the Email, Date and
      // Status columns even on a full-width screen and buried the row
      // entirely on a narrow one -- the table could not be read without
      // scrolling sideways past its own controls. What stays is what a
      // pipeline decision needs: edit the details, and say won or lost.
      // Wording, Files, Follow up and Delete move behind More, which opens a
      // dialog rather than a dropdown: an absolutely positioned menu inside
      // .tablewrap{overflow-x:auto} gets clipped by its own scroller, and
      // every other action on this page is already a dialog.
      '<td class="num"><button class="btn small secondary" data-editlead="' + x.id + '">Edit</button> ' +
        (x.status === 'won' ? (x.build_status === 'awaiting_approval' ? '<span class="muted">waiting on Joseph</span> ' : '') :
        '<button class="btn small" data-win="' + x.id + '">Mark won</button> ' +
        '<button class="btn small danger" data-lost="' + x.id + '">Lost</button> ') +
        '<button class="btn small secondary" data-leadmore="' + x.id + '">More</button>' +
        // Delete sits on EVERY row for the admin, whatever the status. The
        // first version put it inside the "won" branch only, so none of
        // Joseph's four open test leads could ever show one — the button
        // existed and was unreachable.
        //
        // It is not the same thing as Lost. Lost means they said no, and
        // counts against that rep's conversion rate. Delete means the row
        // should never have been there, and counts for nothing.
        //
        // can_delete comes from the API, which decides it with the same test
        // the DELETE route makes: a lead stays only while a rep has earned
        // from its company. The page cannot see rep_earnings, so it must not
        // try to work this out for itself. The admin rule is the page's own to
        // apply — it knows that reliably.
        '</td></tr>'
    ).join('') || '<tr data-empty-row><td colspan="' + (state.isRep ? 5 : (showWonBy ? 7 : 6)) + '" class="muted" style="padding:18px">' +
      (state.leads.length ? 'Every lead here has been won. They are on the Companies tab.' : 'No leads yet.') + '</td></tr>') +
    '</tbody></table></div>';

  const form = $('leadForm');
  if(keep){
    const details = $('tab-leads').querySelector('details');
    if(details) details.open = keep.open;
    const wording = $('tab-leads').querySelector('details.wording');
    if(wording) wording.open = keep.wordingOpen;
    Object.entries(keep.values).forEach(([name, value]) => {
      const el = form.querySelector('[name="' + name + '"]');
      // The date box defaults to today; only put back what was really typed.
      if(el && (!el.value || name !== 'found_on')) el.value = value;
    });
    if(keep.focused){
      const el = form.querySelector('[name="' + keep.focused + '"]');
      if(el) el.focus();
    }
  }

  // Wired AFTER the boxes above are refilled, not before: the wizard reads
  // each box to draw its sentence preview, and `keep` puts values back by
  // assigning .value, which fires no input event. Wiring first left a rep
  // who had typed wording looking at "If left empty: …" the moment the list
  // redrew behind them.
  wireWording($('tab-leads'));
  wireSearch('tab-leads', 'leads');
  form.addEventListener('submit', (e) => { e.preventDefault(); submitLead(form, false); });
  // Pre-filled with the company name and tied to the lead, so a follow-up set
  // from here needs one word typed and still points back at the right row.
  $('tab-leads').querySelectorAll('[data-win]').forEach((b) => b.addEventListener('click', () => winLeadDialog(b.dataset.win)));
  $('tab-leads').querySelectorAll('[data-editlead]').forEach((b) => b.addEventListener('click', () => editLeadDialog(b.dataset.editlead)));
  $('tab-leads').querySelectorAll('[data-leadmore]').forEach((b) => b.addEventListener('click', () => leadMoreDialog(b.dataset.leadmore)));
  if($('toggleWon')) $('toggleWon').addEventListener('click', async () => {
    state.showWonLeads = !state.showWonLeads;
    await renderLeads();
  });
  $('tab-leads').querySelectorAll('[data-lost]').forEach((b) => b.addEventListener('click', () => lostDialog(b.dataset.lost)));
}
function todayYmd(){ return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
function formData(form){ const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }

async function submitLead(form, confirmDuplicate){
  const d = formData(form);
  const body = { company_name: d.company_name, contact_name: d.contact_name, phone: d.phone, email: d.email, website: d.website, notes: d.notes, found_on: d.found_on || undefined, brought_in_by_rep_id: d.brought_in_by_rep_id || null };
  const copy = readCopyFields(form);
  if(Object.keys(copy).length) body.copy = copy;
  if(confirmDuplicate) body.confirm_duplicate = true;
  try{
    await post('/rep-leads', body);
    form.reset();
    flash('Lead added.', true);
    await renderLeads();
  }catch(err){
    if(err.code === 'possible_duplicate'){
      const canAdd = err.body.can_add_anyway !== false;
      // A match the server would not show us belongs to another rep: we are
      // told the company is taken and nothing else, so say exactly that.
      const m = (err.body.matches || []).map((x) => x.visible === false
        ? '<li><b>' + esc(x.company_name) + '</b> — already being worked</li>'
        : '<li><b>' + esc(x.company_name) + '</b> ' + esc([x.contact_name, x.phone, x.email].filter(Boolean).join(' · ')) + ' — found ' + esc(plainDate(x.found_on)) + (x.brought_in_by_rep_id ? ' by ' + esc(repName(x.brought_in_by_rep_id)) : '') + ' (' + esc(x.status || '') + ')</li>').join('');
      $('dupBox').innerHTML = '<div class="notice"><b>' + esc(err.message) + '</b><ul>' + m + '</ul>' +
        (canAdd
          ? 'If it is a different company, add it anyway. <div class="actions"><button class="btn small" id="addAnyway" type="button">Add anyway</button></div>'
          : '') + '</div>';
      if(canAdd) $('addAnyway').addEventListener('click', () => submitLead(form, true));
    } else flash(err.message);
  }
}
// Lost removes the lead for good: the company, the contact, the notes and any
// files on it. Worth a real dialog rather than a browser confirm, because it
// cannot be undone and the list is where someone's work lives.
// Edit a lead's details. The same boxes as "Add a lead", minus the wording
// (that has its own dialog) and minus the status (Mark won and Lost own that,
// and the API refuses a status change on a won lead anyway).
// The rest of a lead's actions, off the row. Each one opens the dialog it
// always opened; this just replaces #dlg's contents, so there is nothing to
// close first.
function leadMoreDialog(id){
  const lead = state.leads.find((x) => x.id === id);
  if(!lead) return flash('That lead is gone. Refresh the tab.');
  openDialog(
    '<h3>' + esc(lead.company_name) + '</h3>' +
    '<p class="hint">Everything else you can do with this lead.</p>' +
    '<div class="actions" style="justify-content:flex-start;flex-wrap:wrap">' +
      '<button class="btn secondary" type="button" data-more="wording">Wording</button> ' +
      '<button class="btn secondary" type="button" data-more="files">Files</button> ' +
      '<button class="btn secondary" type="button" data-more="followup">Follow up</button> ' +
      // Delete is the admin's and only while the API says the lead may still
      // go -- the same test the DELETE route makes. Kept last and apart from
      // the others, because it is not the same thing as Lost.
      (state.isAdmin && lead.can_delete
        ? '<button class="btn danger" type="button" data-more="delete">Delete</button>' : '') +
    '</div>' +
    '<div class="actions"><button type="button" class="btn secondary" id="cancelDlg">Close</button></div>'
  );
  $('cancelDlg').addEventListener('click', closeDialog);
  const go = {
    wording: () => wordingDialog(id),
    files: () => filesDialog(id),
    followup: () => followupDialog(null, {
      title: 'Follow up with ' + lead.company_name,
      lead_id: id,
      tenant_id: lead.tenant_id || null,
    }),
    delete: () => deleteWonLeadDialog(id),
  };
  $('dlg').querySelectorAll('[data-more]').forEach((b) =>
    b.addEventListener('click', () => go[b.dataset.more]()));
}

function editLeadDialog(id){
  const lead = state.leads.find((x) => x.id === id);
  // Another device may have deleted it since this table was drawn. Three

  // which showed the person nothing at all.
  if(!lead) return flash('That lead is gone. Refresh the tab.');
  openDialog(

async function drawFiles(leadId){
  let files = [];
  try{ files = (await api('/rep-leads/' + leadId + '/files')).files; }catch(err){ $('fileBody').innerHTML = '<div class="notice">' + esc(err.message) + '</div>'; return; }
  const logo = files.find((f) => f.kind === 'logo');
  $('fileBody').innerHTML =
    '<p class="muted">Drop their logo here, or anything else that shows their colours — a brand sheet, a photo of their sign, a screenshot. The logo is the one that ends up on their pages.</p>' +
    '<div id="drop" style="border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#FBF9F5">' +
      '<b>Drop files here</b><div class="muted">or click to choose · PNG, JPG, WEBP, GIF, SVG or PDF, up to 5MB</div>' +
      '<input type="file" id="filePick" multiple accept="' + FILE_TYPES + '" style="display:none">' +
    '</div>' +
    '<div id="upMsg" class="msg"></div>' +
    (files.length
      ? '<div class="tablewrap" style="margin-top:14px"><table style="min-width:0"><tbody>' +
        files.map((f) =>
          '<tr><td style="width:52px">' + (/^image\/(png|jpe?g|webp|gif|svg)/.test(f.content_type)
            ? '<img src="' + esc(f.public_url) + '" alt="" style="width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px">'
            : '<span class="pill">PDF</span>') + '</td>' +
          '<td><b>' + esc(f.filename) + '</b><div class="muted">' + Math.max(1, Math.round(f.size_bytes / 1024)) + ' KB' + (f.kind === 'logo' ? ' · their logo' : '') + '</div></td>' +
          '<td class="num">' + (f.kind === 'logo' ? '' : '<button class="btn small secondary" data-mklogo="' + f.id + '">Use as logo</button> ') +
            '<button class="btn small danger" data-delfile="' + f.id + '">Remove</button></td></tr>'
        ).join('') + '</tbody></table></div>'
      : '<p class="muted" style="margin-top:12px">Nothing yet.</p>') +
    '<div class="actions"><button class="btn secondary" id="cancelDlg" type="button">Done</button></div>';

  void logo;
  $('cancelDlg').addEventListener('click', () => { closeDialog(); renderLeads().catch(() => {}); });
  const drop = $('drop'), pick = $('filePick');
  drop.addEventListener('click', () => pick.click());
  pick.addEventListener('change', () => uploadFiles(leadId, [...pick.files]));
  ['dragenter','dragover'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.style.borderColor = 'var(--secondary)'; }));
  ['dragleave','drop'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.style.borderColor = 'var(--line)'; }));
  drop.addEventListener('drop', (ev) => uploadFiles(leadId, [...(ev.dataTransfer ? ev.dataTransfer.files : [])]));
  $('fileBody').querySelectorAll('[data-delfile]').forEach((b) => b.addEventListener('click', async () => {
    try{ await api('/rep-lead-files/' + b.dataset.delfile, { method:'DELETE' }); await drawFiles(leadId); }
    catch(err){ upMsg(err.message, false); }
  }));
  $('fileBody').querySelectorAll('[data-mklogo]').forEach((b) => b.addEventListener('click', async () => {
    // One logo per lead: re-upload under kind=logo is the simplest honest way
    // to change which one it is, so this just tells them to drop it again.
    upMsg('Remove the current logo first, then drop this one in — the first image you add becomes the logo.', false);
    void b;
  }));
}

function upMsg(text, ok){ const el = $('upMsg'); if(!el) return; el.textContent = text; el.className = 'msg show ' + (ok ? 'okmsg' : 'err'); }

async function uploadFiles(leadId, files){
  if(!files.length) return;
  const existing = (await api('/rep-leads/' + leadId + '/files').catch(() => ({ files: [] }))).files || [];
  let haveLogo = existing.some((f) => f.kind === 'logo');
  for(const file of files){
    if(file.size > 5 * 1024 * 1024){ upMsg(file.name + ' is bigger than 5MB.', false); continue; }
    upMsg('Uploading ' + file.name + '…', true);
    // The first image on a lead is its logo, because that is what a rep
    // almost always drops first and asking would be a question with one
    // sensible answer.
    const isImage = /^image\//.test(file.type);
    const kind = (!haveLogo && isImage) ? 'logo' : 'other';
    try{
      const s = getSession();
      const res = await fetch(API_BASE + '/rep-leads/' + leadId + '/files?kind=' + kind + '&filename=' + encodeURIComponent(file.name), {
        method:'POST',
        headers:{ 'Content-Type': file.type || 'application/octet-stream', ...(s ? { Authorization: 'Bearer ' + s.access_token } : {}) },
        body: file,
      });
      const body = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(body.error || ('Upload failed (' + res.status + ')'));
      if(kind === 'logo') haveLogo = true;
    }catch(err){ upMsg(file.name + ': ' + err.message, false); }
  }
  upMsg('Uploaded.', true);
  await drawFiles(leadId);
}

// One line under a company's name: when it last had a referral, and how much
// has gone out and come back. Tinted when it has gone quiet, because the
// whole point is to see that without opening fourteen reports one at a time.
function dealerActivityHtml(x){
  const bits = [];
  const since = daysSince(x.last_referral_at);
  if(x.last_referral_at){
    const quiet = since !== null && since >= 60;
    bits.push('<span' + (quiet ? ' class="warn"' : '') + '>Last referral ' + esc(agoText(x.last_referral_at)) + '</span>');
  } else if(x.invites_total > 0){
    bits.push('<span class="warn">No referrals yet</span>');
  } else {
    bits.push('<span class="warn">No invites sent yet</span>');
  }
  if(x.invites_total || x.referrals_total){
    bits.push(x.invites_total + ' invited \u00b7 ' + x.referrals_total + ' referred');
  }
  // Admin only: whether the automatic yearly charge has a card to take.
  if(x.renewal_due_at){
    const d = daysSince(x.renewal_due_at);
    const soon = d !== null && d >= -30;
    bits.push('<span' + (soon ? ' class="warn"' : '') + '>Renews ' + esc(plainDate(String(x.renewal_due_at).slice(0,10))) + '</span>');
  }
  if(x.has_card === false && !x.billing_exempt){
    bits.push('<span class="warn">No card on file</span>');
  }
  return '<div class="muted" style="font-size:12px">' + bits.join(' \u00b7 ') + '</div>';
}

/* ---------- charts ---------- */
// Drawn by hand as SVG rather than pulled from a library: these are a dozen
// bars and a ring, the page already has no build step and no dependencies, and
// a chart that inherits the page's own colours and prints with it is worth
// more here than one that arrives with its own opinions.

// A "nice" top to the axis, so the gridline labels are round numbers a person
// reads at a glance rather than 1,347.
function niceMax(value){
  if(!(value > 0)) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(value)));
  const n = value / pow;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * pow;
}

// Grouped bars: one group per month, one bar per series.
// series: [{ key, label, color }], rows: [{ label, [key]: number }]
function barChart(rows, series, { money = false, height = 190 } = {}){
  const W = 760, H = height, padL = 52, padR = 10, padT = 12, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = niceMax(Math.max(0, ...rows.flatMap((r) => series.map((s) => Number(r[s.key]) || 0))));
  const groupW = plotW / rows.length;
  const barW = Math.max(3, (groupW - 6) / series.length);
  const y = (v) => padT + plotH - (Math.max(0, v) / max) * plotH;
  const fmt = (v) => money ? dollars(v) : String(v);

  let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Monthly chart">';
  // Four gridlines, labelled, because a bar you cannot measure is decoration.
  for(let i = 0; i <= 4; i++){
    const v = (max / 4) * i, gy = y(v);
    svg += '<line class="axis" x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '"></line>';
    svg += '<text x="' + (padL - 6) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end">' + esc(money ? dollars(v).replace(/\.00$/, '') : Math.round(v)) + '</text>';
  }
  rows.forEach((row, i) => {
    const gx = padL + i * groupW;
    series.forEach((sdef, j) => {
      const v = Number(row[sdef.key]) || 0;
      const bx = gx + 3 + j * barW;
      const by = y(v), bh = Math.max(v > 0 ? 1.5 : 0, padT + plotH - by);
      svg += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + (barW - 1.5).toFixed(1) +
             '" height="' + bh.toFixed(1) + '" rx="2" fill="' + sdef.color + '"><title>' +
             esc(row.label + ' · ' + sdef.label + ': ' + fmt(v)) + '</title></rect>';
    });
    svg += '<text x="' + (gx + groupW / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(row.label) + '</text>';
  });
  svg += '</svg>';
  const legend = '<div class="legend">' + series.map((sdef) =>
    '<span><i style="background:' + sdef.color + '"></i>' + esc(sdef.label) + '</span>').join('') + '</div>';
  return '<div class="chartwrap">' + svg + '</div>' + legend;
}

// A ring rather than a pie: the hole is where the number that matters goes.
function donut(slices, centreTop, centreSub){
  const size = 150, r = 58, stroke = 22, c = size / 2;
  const total = slices.reduce((n, s) => n + s.value, 0);
  let angle = -Math.PI / 2;
  let paths = '';
  if(total > 0){
    slices.forEach((s) => {
      if(s.value <= 0) return;
      const sweep = (s.value / total) * Math.PI * 2;
      const end = angle + sweep;
      // A slice that is the whole ring cannot be drawn as an arc; draw a circle.
      if(s.value === total){
        paths += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="' + stroke + '"><title>' + esc(s.label + ': ' + s.value) + '</title></circle>';
      }else{
        const x1 = c + r * Math.cos(angle), y1 = c + r * Math.sin(angle);
        const x2 = c + r * Math.cos(end), y2 = c + r * Math.sin(end);
        paths += '<path d="M ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' +
                 (sweep > Math.PI ? 1 : 0) + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + '" fill="none" stroke="' +
                 s.color + '" stroke-width="' + stroke + '" stroke-linecap="butt"><title>' + esc(s.label + ': ' + s.value) + '</title></path>';
      }
      angle = end;
    });
  }else{
    paths = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"></circle>';
  }
  return '<svg class="chart" style="min-width:0;max-width:' + size + 'px;margin:0 auto" viewBox="0 0 ' + size + ' ' + size + '" role="img">' +
    paths +
    '<text x="' + c + '" y="' + (c - 2) + '" text-anchor="middle" style="font-family:Fraunces,serif;font-size:21px;fill:var(--primary)">' + esc(centreTop) + '</text>' +
    '<text x="' + c + '" y="' + (c + 15) + '" text-anchor="middle">' + esc(centreSub) + '</text></svg>' +
    '<div class="legend" style="justify-content:center">' + slices.map((s) =>
      '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + ' ' + s.value + '</span>').join('') + '</div>';
}

// What the dealer's own page header will look like, drawn from whatever is in
// the boxes right now. Cheaper than imagining it, and it catches a logo that
// disappears on a dark bar before the dealer sees it.
function drawPreview(){
  const get = (k) => ($('dlg').querySelector('[data-hex="' + k + '"]') || {}).value || '#000000';
  const p = $('previewBar');
  if(!p) return;
  p.style.background = get('primaryColor');
  p.style.color = '#fff';
  const chip = $('previewAccent');
  if(chip){ chip.style.background = get('accentColor'); }
  const body = $('previewBody');
  if(body){ body.style.background = get('bg'); }
}

        // Only prices Joseph actually changed. Sending the standard ones
        // explicitly would pin them on the dealer, so a later change to what
        // "standard" means would skip every dealer built before it.
        ...readPricingFields(e.target, { onlyChanges: true }),
      });
      closeDialog();
      const trouble = (out.emailed && out.emailed.problems) || [];
      flash(trouble.length
        ? out.name + '\u2019s dashboard is built, but: ' + trouble.join(' ')
        : out.name + '\u2019s dashboard is built. ' + out.admin_email + ' has their sign-in link, and the rep knows it is live.', trouble.length === 0);
      await renderBuilds();
    }catch(err){
      flash(err.message);
      btn.disabled = false; btn.textContent = 'Build dashboard';
    }
  });
}

/* ---------- removing a company or a rep for good ---------- */
// The dialog's job is to make the consequence impossible to misread before
// the button works: what disappears, what stays, and that the card stops.
// The name has to be typed exactly, so this cannot happen on a misclick.
function confirmDeleteDialog({ title, name, lead, goes, stays, button, onConfirm }){
  openDialog(
    '<h3>' + esc(title) + '</h3>' +
    '<p>' + lead + '</p>' +
    '<div class="notice"><b>Gone for good</b><ul style="margin:6px 0 0;padding-left:18px">' +
      goes.map((x) => '<li>' + x + '</li>').join('') + '</ul></div>' +
    '<p class="muted"><b>Kept:</b> ' + stays + '</p>' +
    '<form id="delForm">' +
      '<label>Type <b>' + esc(name) + '</b> to confirm</label>' +
      '<input name="confirm_name" autocomplete="off" spellcheck="false" placeholder="' + esc(name) + '">' +
      '<label>Why? (optional, kept with the record)</label>' +
      '<input name="reason" maxlength="500">' +
      '<div class="actions">' +
        '<button type="button" class="btn secondary" id="cancelDlg">Keep it</button>' +
        '<button class="btn danger" type="submit" id="doDelete" disabled>' + esc(button) + '</button>' +
      '</div></form>'
  );
  const form = $('delForm');
  const typed = form.querySelector('[name=confirm_name]');
  const go = $('doDelete');
  // Exact, trimmed only at the ends — a name is not a password, but it is not
  // a yes/no either.
  typed.addEventListener('input', () => { go.disabled = typed.value.trim() !== name; });
  typed.focus();
  $('cancelDlg').addEventListener('click', closeDialog);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(typed.value.trim() !== name) return;
    go.disabled = true; go.textContent = 'Removing…';
    try{
      await onConfirm({ confirm_name: typed.value.trim(), reason: form.querySelector('[name=reason]').value.trim() || undefined });
    }catch(err){
      flash(err.message);
      go.disabled = false; go.textContent = button;
    }
  });
}

// What a dealer pays, after they are already running — a renegotiation, or
// fixing a price set wrong at build time. Admin only on the server too: this
// reads and writes another tenant's row, which RLS hides from the signed-in
// user entirely, so the API does it with the service role behind an explicit
// admin check rather than relying on this button being hidden.
// Who can sign in to a dealer's dashboard — which is the same list the
// platform emails when a referral is marked paid and the gift cards have to
// go out. Until this existed a dealer had exactly one, set at build time, so
// one person on holiday meant nobody at that business was told.
async function loginsDialog(tenantId){
  let cur;
  try{
    cur = await api('/rep-dealers/' + tenantId + '/admins');
  }catch(err){ return flash(err.message); }

  // 50. sending this dealer's cards is the one case where a tick would mean
  // nothing: the alert goes to Joseph and no login is consulted. Show that
  // plainly rather than offering a choice that quietly does nothing.
  const weSend = cur.reward_fulfillment === 'platform';
  const anyTicked = cur.admins.some((a) => a.gets_reward_alerts);

  const rows = cur.admins.map((a) =>
    '<tr><td><b>' + esc(a.name || a.email) + '</b>' +
      (a.name ? '<div class="muted">' + esc(a.email) + '</div>' : '') + '</td>' +
    '<td data-label="Gift-card email">' +
      '<label class="tickcell">' +
        '<input type="checkbox" data-alert="' + esc(a.id) + '"' +
          (a.gets_reward_alerts ? ' checked' : '') + (weSend ? ' disabled' : '') +
          ' title="' + (weSend ? 'You send this company\'s gift cards' : 'Send this person the gift-card email') + '">' +
      '</label>' +
    '</td>' +
    '<td class="num">' +
      // Resend is on every login, including the only one -- the person who
      // cannot get in is often the only person on the account.
      '<button type="button" class="btn small secondary" data-resend="' + esc(a.id) + '">Resend login</button> ' +
      // The last one is never removable: a dealer with no login cannot sign
      // in and nobody is told to send their cards. The button is hidden
      // rather than shown-and-refused, and the API refuses it regardless.
      (cur.admins.length > 1
        ? '<button type="button" class="btn small danger" data-rmadmin="' + esc(a.id) + '">Remove</button>'
        : '<span class="muted">only login</span>') +
    '</td></tr>').join('');

  openDialog(
    '<h3>Who can sign in to ' + esc(cur.name) + '</h3>' +
    '<p class="muted">Everyone here can sign in and mark referrals paid.</p>' +
    '<p class="muted">' + (weSend
      ? 'You send this company\'s gift cards, so the &ldquo;send the gift cards&rdquo; email comes to you and nobody here is emailed about it. Change that on their Pricing screen.'
      : (anyTicked
        ? 'Only the people ticked below get the &ldquo;send the gift cards&rdquo; email when a referral is marked paid.'
        : 'Nobody is ticked, so that email goes to whoever added the customer and copies everyone else here. Tick someone to send it to them alone instead.')) +
    '</p>' +
    // min-width:0, because this one lives in a 560px dialog rather than the
    // full page. At the global 640px minimum the table would be wider than
    // the dialog holding it, and the sticky button column would sit on top
    // of the very checkboxes this screen exists for.
    '<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Login</th><th>Gift-card email</th><th></th></tr></thead><tbody>' +
      rows + '</tbody></table></div>' +
    '<form id="addAdminForm" style="margin-top:14px">' +
      '<div class="row">' +
        '<div><label>Add someone \u2014 their email</label><input name="email" type="email" required maxlength="200" placeholder="name@theircompany.com"></div>' +
        '<div><label>Their name</label><input name="name" maxlength="120"></div>' +
      '</div>' +
      '<p class="hint">They get an email with a link to choose their own password. No password is ever sent.</p>' +
      '<p class="hint"><b>Resend login</b> sends that person a brand-new link. It also stops any earlier link working, so use it when someone never got the email or theirs has expired.</p>' +
      '<div class="actions">' +
        '<button type="button" class="btn secondary" id="cancelDlg">Done</button>' +
        '<button class="btn" type="submit" id="addAdmin">Add login</button>' +
      '</div></form>'
  );
  $('cancelDlg').addEventListener('click', async () => { closeDialog(); await renderDealers(); });

  // Saves on the tick itself: there is no Save button on this dialog, and
  // adding one for a single checkbox would be a worse trade than writing
  // immediately and putting the box back if the write fails.
  $('dlg').querySelectorAll('[data-alert]').forEach((cb) => cb.addEventListener('change', async () => {
    const wanted = cb.checked;
    cb.disabled = true;
    try{
      await patch('/rep-dealers/' + tenantId + '/admins/' + cb.dataset.alert, { gets_reward_alerts: wanted });
      cb.disabled = false;
      // Reopen so the paragraph above the list matches what is now ticked:
      // it says something different when nobody is.
      await loginsDialog(tenantId);
    }catch(err){
      cb.checked = !wanted;
      cb.disabled = false;
      dialogError(err.message);
    }
  }));

  $('dlg').querySelectorAll('[data-resend]').forEach((b) => b.addEventListener('click', async () => {
    if(b.disabled) return;
    const was = b.textContent;
    b.disabled = true; b.textContent = 'Sending\u2026';
    try{
      const r = await post('/rep-dealers/' + tenantId + '/admins/' + b.dataset.resend + '/resend', {});
      b.textContent = 'Sent';
      flash('A fresh sign-in link is on its way to ' + (r.emailed_to || 'them') + '.', true);
    }catch(err){
      // Stays in the dialog: the person is standing by to be let in, and the
      // reason belongs where they are looking.
      dialogError(err.message);
      b.disabled = false; b.textContent = was;
    }
  }));

  $('dlg').querySelectorAll('[data-rmadmin]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    try{
      await api('/rep-dealers/' + tenantId + '/admins/' + b.dataset.rmadmin, { method:'DELETE' });
      closeDialog();
      flash('Login removed.', true);
      await loginsDialog(tenantId);
    }catch(err){ flash(err.message); b.disabled = false; }
  }));

  $('addAdminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('addAdmin');
    btn.disabled = true; btn.textContent = 'Adding\u2026';
    const d = Object.fromEntries(new FormData(e.target));
    try{
      const out = await post('/rep-dealers/' + tenantId + '/admins', { email: d.email, name: d.name || undefined });
      closeDialog();
      // The login exists whether or not the email got through, and saying
      // which is what lets Joseph send the link himself if it did not.
      flash(out.emailed && out.emailed.sent
        ? d.email + ' can sign in once they set a password \u2014 the link is on its way.'
        : d.email + ' was added, but: ' + ((out.emailed && out.emailed.problem) || 'no link could be emailed.'),
        !!(out.emailed && out.emailed.sent));
      await loginsDialog(tenantId);
    }catch(err){
      flash(err.message);
      btn.disabled = false; btn.textContent = 'Add login';
    }
  });
}

async function deleteCompanyDialog(tenantId){
  const c = state.dealers.find((x) => x.tenant_id === tenantId);
  if(!c) return flash('That company is gone.');
  if(c.billing_exempt) return flash('That is one of your own companies. It cannot be removed here.');
  if(c.closed_at) return flash(c.name + ' is already closed.');

  // What happens depends on whether they ever traded, so the dialog says which
  // it will be before the button is pressed rather than reporting it after.
  // The database decides for real, under the row lock; this only has to match
  // what the person is about to see.
  let traded = Boolean(c.activated);
  try{
    const r = await api('/reports/tenant/' + tenantId);
    traded = traded || Boolean(r.totals.paid_cents);
  }catch(err){ /* fall back to whether they ever paid the $500 */ }

  confirmDeleteDialog({
    title: (traded ? 'Close ' : 'Delete ') + c.name,
    name: c.name,
    lead: traded
      ? 'They traded with you, so their payments have to stay in your books. Their card comes off file first \u2014 no renewal, no 30% fee, nothing more can be charged \u2014 and they move out of this list into <b>closed</b>.'
      : 'They never traded: no payment taken, nothing earned from them. There is nothing to keep, so this removes them completely \u2014 row and all.',
    goes: traded
      ? [
        'Every customer and referral name, email and phone number \u2014 wiped, though the counts stay so their year still reads',
        'Their logins \u2014 nobody there can sign in again',
        'Their saved card, renewal date and sending address',
      ]
      : [
        'The company, and every trace of it',
        'Every customer, referral, link and login',
        'Their branding, wording and sending address',
      ],
    stays: traded
      ? 'Their name and everything they paid you stay in your books, so Finances and past years still add up. Their report still opens, with the numbers but no names. The lead that brought them in keeps your rep\u2019s credit.'
      : 'Nothing \u2014 there is nothing of theirs in your books. The lead that brought them in stays, so your rep keeps credit for the work.',
    button: traded ? 'Close this company' : 'Delete this company',
    onConfirm: async (body) => {
      const out = await api('/rep-dealers/' + tenantId, { method:'DELETE', body: JSON.stringify(body) });
      closeDialog();
      flash(out.outcome === 'deleted'
        ? out.name + ' is deleted \u2014 nothing of theirs is left.'
        : out.name + ' is closed. ' + (out.card_detached ? 'Their card is off file. ' : 'There was no card on file. ') +
          out.customers_affected + ' customer' + (out.customers_affected === 1 ? '' : 's') + ' anonymised; their numbers still open from the closed list.', true);
      state.closedCount = null; // one more, or one fewer company — recount
      await renderDealers();
    },
  });
}

function deleteRepDialog(repId){
  const r = state.reps.find((x) => x.id === repId);
  if(!r) return flash('That rep is gone.');
  if(r.closed_at) return flash(r.name + ' has already been removed.');
  const owed = r.owed_cents || 0;
  if(owed !== 0){
    return flash(owed > 0
      ? 'You still owe ' + r.name + ' ' + dollars(owed) + '. Pay them or reverse the earnings first, then remove them.'
      : r.name + ' has been overpaid by ' + dollars(Math.abs(owed)) + '. Settle that first, then remove them.');
  }
  // has_history comes from the API, which computes it with the same three
  // tests remove_rep() makes. It is NOT guessed from the money or the dealer
  // counts: those count current assignments, which disappear when a company is
  // deleted, while the rep's leads deliberately stay. Guessing that way told
  // Joseph it would delete Ben outright — "the leads stay in the pipeline, with
  // nobody on them" — when the database would have closed him and kept his
  // name on those leads, which is the only thing a won lead permits.
  const keep = r.has_history !== false;
  confirmDeleteDialog({
    title: (keep ? 'Remove ' : 'Delete ') + r.name,
    name: r.name,
    lead: keep
      ? 'Their balance is settled, so nothing is owed either way. Their name has to stay on the leads they closed and on anything they earned, so the record keeps adding up.'
      : 'Nothing anywhere points at them \u2014 no money, no leads. This removes them completely.',
    goes: [
      'Their login \u2014 they cannot sign in again',
      'Their email, phone and notes',
      'Their place on every dealer, so nothing from here on earns them anything',
    ].concat(keep ? [] : ['Their name, and the rep record itself']),
    stays: keep
      ? 'Their name stays on the leads they brought in or closed, and on what they earned and what you paid them, so your statements and your pipeline both still read correctly. They stop counting as active.'
      : 'Nothing \u2014 there is nothing of theirs to keep.',
    button: keep ? 'Remove this rep' : 'Delete this rep',
    onConfirm: async (body) => {
      const out = await api('/reps/' + repId, { method:'DELETE', body: JSON.stringify(body) });
      closeDialog();
      flash(out.name + (out.outcome === 'deleted' ? ' is deleted \u2014 nothing of theirs is left.' : ' is removed. What they earned stays in your money history.') +
        (out.dealers_released ? ' Taken off ' + out.dealers_released + ' dealer' + (out.dealers_released === 1 ? '' : 's') + '.' : ''), true);
      await loadReps();
      await renderReps();
    },
  });
}

      amount_cents: Math.round(Number(f.amount || 0) * 100),
      started_on: f.started_on || undefined,

      if(id) await patch('/reports/expenses/' + id, body); else await post('/reports/expenses', body);

    }catch(err){ dialogError(err.message); }

    '<form id="payForm"><div class="row"><div><label>Amount ($)</label><input name="amount" type="number" min="0.01" step="0.01" required value="' + ((suggestedCents || owed) / 100).toFixed(2) + '"></div>' +
    '<div><label>Date paid</label><input name="paid_on" type="date" required value="' + todayYmd() + '"></div></div>' +
    '<div class="row"><div><label>How (Zelle, check…)</label><input name="method" maxlength="60"></div><div><label>For statement month</label><input name="period" type="month" value="' + esc(state.month) + '"></div></div>' +
    '<label>Note</label><input name="note" maxlength="500"><div class="actions"><button type="button" class="btn secondary" id="cancelDlg">Cancel</button><button class="btn" type="submit">Record payment</button></div></form>');
  $('cancelDlg').addEventListener('click', closeDialog);
  $('payForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = formData(e.target);
    try{
      await post('/reps/' + repId + '/payouts', { amount_cents: Math.round(Number(d.amount) * 100), paid_on: d.paid_on, period: d.period || null, method: d.method || null, note: d.note || null });
      closeDialog(); flash('Payment recorded.', true); await renderMoney();
    }catch(err){ dialogError(err.message); }
  });
}

async function statementDialog(repId){
  const s = await api('/reps/' + repId + '/statement?month=' + state.month);
  const label = { activation: 'Sign-up bonus', referral: 'Referral royalty', reversal: 'Reversal' };
  const lineDetail = (l) => {
    const d = l.detail || {};
    if(l.kind === 'referral'){
      const per = d.reward_per_card_cents != null ? ' · ' + dollars(d.reward_per_card_cents) + ' cards' : '';
      const late = d.after_threshold ? ' · company #' + d.company_number + ' (reduced rate)' : '';
      return per + late;
    }
    if(l.kind === 'reversal') return d.reason === 'manual' ? (d.note ? ' · ' + esc(d.note) : ' · reversed by hand') : ' · ' + esc(String(d.reason || '').replace(/_/g, ' '));
    return '';
  };
  const reversible = new Set(s.lines.filter((l) => l.reversal_of).map((l) => l.reversal_of));
  openDialog(
    '<div class="noprint actions" style="justify-content:space-between;margin:0 0 6px"><span></span><button class="btn small secondary" id="printStmt" type="button">Print</button></div>' +
    '<h3>' + esc(s.rep.name) + ' — ' + esc(monthLabel(s.month)) + '</h3>' +
    '<p class="muted">Statement from 50. · ' + esc(s.rep.email || '') + '</p>' +
    '<div class="tablewrap" style="margin:10px 0"><table style="min-width:0"><tbody>' +
      '<tr><td>Owed at the start of the month</td><td class="num">' + dollarCell(s.opening_cents) + '</td></tr>' +
      '<tr><td>Sign-up bonuses</td><td class="num">' + dollarCell(s.activation_cents) + '</td></tr>' +
      '<tr><td>Referral royalties</td><td class="num">' + dollarCell(s.royalty_cents) + '</td></tr>' +
      (s.reversal_cents ? '<tr><td>Reversals</td><td class="num">' + dollarCell(s.reversal_cents) + '</td></tr>' : '') +
      '<tr><td>Paid this month</td><td class="num">' + dollarCell(-s.paid_cents) + '</td></tr>' +
      '<tr><td><b>Owed at the end of the month</b></td><td class="num"><b>' + dollarCell(s.closing_cents) + '</b></td></tr></tbody></table></div>' +
    '<h3 style="font-size:15px;margin-top:14px">Earnings</h3>' +
    '<div class="tablewrap"><table style="min-width:0"><tbody>' +
      (s.lines.map((l) => '<tr><td>' + esc(dateOnly(l.at)) + '</td><td>' + esc(label[l.kind] || l.kind) + ' <span class="muted">· ' + esc(l.role) + ' · ' + esc(l.dealer || '') + lineDetail(l) + '</span></td><td class="num">' + dollarCell(l.amount_cents) + '</td>' +
        '<td class="noprint num">' + (l.kind !== 'reversal' && !reversible.has(l.id) ? '<button class="btn small danger" data-rev="' + l.id + '">Reverse</button>' : '') + '</td></tr>').join('') || '<tr><td class="muted" style="padding:14px">Nothing earned this month.</td></tr>') +
    '</tbody></table></div>' +
    (s.payouts.length ? '<h3 style="font-size:15px;margin-top:14px">Payments</h3><div class="tablewrap"><table style="min-width:0"><tbody>' +
      s.payouts.map((p) => '<tr><td>' + esc(plainDate(p.paid_on)) + '</td><td>' + esc([p.method, p.note].filter(Boolean).join(' · ')) + '</td><td class="num">' + dollars(p.amount_cents) + '</td><td class="noprint num"><button class="btn small danger" data-delpay="' + p.id + '">Delete</button></td></tr>').join('') + '</tbody></table></div>' : '') +
    '<div class="actions noprint"><button class="btn secondary" id="cancelDlg" type="button">Close</button><button class="btn" id="payFromStmt" type="button">Record payment</button></div>'
  );
  $('cancelDlg').addEventListener('click', closeDialog);
  $('printStmt').addEventListener('click', () => window.print());
  $('payFromStmt').addEventListener('click', () => { closeDialog(); payDialog(repId, s.closing_cents > 0 ? s.closing_cents : 0); });
  $('dlg').querySelectorAll('[data-rev]').forEach((b) => b.addEventListener('click', once(b, async () => {
    const note = window.prompt('Reverse this earning? Add a short reason (for example "refunded in Stripe"):', '');
    if(note === null) return;
    try{ await post('/rep-earnings/' + b.dataset.rev + '/reverse', { note }); closeDialog(); flash('Reversed.', true); await renderMoney(); statementDialog(repId); }catch(err){ dialogError(err.message); }
  })));
  $('dlg').querySelectorAll('[data-delpay]').forEach((b) => b.addEventListener('click', once(b, async () => {
    if(!window.confirm('Delete this payment record? What you owe goes back up by that amount.')) return;
    try{ await api('/rep-payouts/' + b.dataset.delpay, { method:'DELETE' }); closeDialog(); flash('Payment deleted.', true); await renderMoney(); statementDialog(repId); }catch(err){ dialogError(err.message); }
  })));
}

/* ---------- boot ---------- */
(async function(){
  const fromLink = readAuthFragment();
  if(fromLink && fromLink.error){
    clearFragment();
    const m = $('loginMsg');
    m.textContent = fromLink.error + ' Ask Joseph to send you a fresh link.';
    m.className = 'msg show err';
    return;
  }
  if(fromLink){
    setSession({ access_token: fromLink.access_token, refresh_token: fromLink.refresh_token });
    clearFragment();
    // recovery and invite both mean "they have no password yet, or are
    // replacing one". Anything else is an ordinary session and goes straight in.
    if(fromLink.type === 'recovery' || fromLink.type === 'invite' || fromLink.type === 'signup'){
      return showSetPassword(await whoAmI());
    }
  }
  if(getSession()) { const ok = await start().then(() => true).catch(() => false); void ok; }
})();
</script>
</body>
</html>
